site_name: LakeLogic
site_description: Consistent Data Contracts across Polars, Pandas, DuckDB, and Spark.
site_url: https://lineagelogic.github.io/LakeLogic/

theme:
  name: material
  font:
    text: "Inter"
    code: "JetBrains Mono"
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Tutorials:
      - Basic Validation: tutorials/basic_validation.md
      - Medallion Architecture: tutorials/medallion_architecture.md
      - Notifications & Secrets: tutorials/notifications_secrets.md
  - Patterns:
      - Overview: playbooks.md
      - Bronze Quality Gate: patterns/bronze_quality_gate.md
      - Dedup & Survivorship: patterns/dedup_survivorship.md
      - SCD2 Dimension: patterns/scd2_dimension.md
      - Late Arriving Reprocess: patterns/late_arriving_reprocess.md
      - External Python Logic: patterns/external_python_logic.md
  - Concepts:
      - Architecture Overview: architecture_diagram.md
      - How it Works: concepts.md
      - Return Values: return_values.md
      - Contract Organization: organization.md
      - Ingestion & Cloud: ingestion.md
      - Reprocessing & Partitioning: reprocessing.md
      - Pipelines & Parallelism: pipelines.md
  - Production:
      - Deployment Patterns: deployment_patterns.md
      - Job Templates: job_templates.md
      - Insurance ELT Example: examples/insurance_elt.md
  - Observability:
      - Overview: observability.md
      - Lineage & Reconciliation: reconciliation.md
      - Notifications & Alerting: notifications.md
  - Reference:
      - Contract Template: contract_template.md
      - CLI: cli.md
      - Driver: driver.md
      - Bootstrap: bootstrap.md
      - API: api.md
      - Capability Matrix: capabilities.md
      - Warehouse Adapters: warehouse_adapters.md
      - Release & Maintenance: maintenance.md
  - Why LakeLogic?: comparison.md

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/theme-switcher.js
