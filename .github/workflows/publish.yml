name: Publish to PyPI

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Optional. If empty, uses version from pyproject.toml on origin/main."
                required: false
            tag:
                description: "Optional tag reference (defaults to v<version>)"
                required: false
    push:
        tags:
            - "v*"
    # release:
    #     types: [published]

permissions:
    contents: write # push the tag on manual dispatch
    id-token: write # mint the OIDC token for PyPI Trusted Publishing (no stored secret)

jobs:
    pypi-publish:
        name: Build and publish Python distributions to PyPI
        runs-on: ubuntu-latest
        # The PyPI trusted publisher is bound to (owner=LakeLogic, repo=LakeLogic,
        # workflow=publish.yml, environment=pypi). Required reviewers on this
        # environment gate every release.
        environment: pypi
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              run: |
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  echo "$HOME/.local/bin" >> $GITHUB_PATH
            - name: Verify uv
              run: uv --version

            - name: Resolve version and tag (manual)
              if: github.event_name == 'workflow_dispatch'
              id: resolve
              env:
                  INPUT_VERSION: ${{ github.event.inputs.version }}
                  INPUT_TAG: ${{ github.event.inputs.tag }}
              run: |
                  python - <<'PY'
                  import os
                  import re
                  import sys
                  import subprocess

                  version = os.environ.get("INPUT_VERSION", "").strip()
                  tag = os.environ.get("INPUT_TAG", "").strip()

                  def parse_version(text):
                      in_project = False
                      for line in text.splitlines():
                          line = line.strip()
                          if line.startswith("[") and line.endswith("]"):
                              in_project = (line == "[project]")
                              continue
                          if in_project:
                              m = re.match(r'version\s*=\s*"([^"]+)"', line)
                              if m:
                                  return m.group(1)
                      return None

                  def read_version_from_ref(ref):
                      try:
                          data = subprocess.check_output(
                              ["git", "show", f"{ref}:pyproject.toml"], text=True
                          )
                      except subprocess.CalledProcessError:
                          return None
                      return parse_version(data)

                  # Prefer main, fallback to master if needed
                  main_version = read_version_from_ref("origin/main")
                  if not main_version:
                      main_version = read_version_from_ref("origin/master")

                  with open("pyproject.toml", "r", encoding="utf-8") as f:
                      current_version = parse_version(f.read())

                  if not current_version:
                      print("Could not find [project] version in current pyproject.toml.")
                      sys.exit(1)

                  if version:
                      if version != current_version:
                          print(
                              f"Version mismatch: current pyproject.toml has {current_version}, "
                              f"input is {version}."
                          )
                          sys.exit(1)
                  else:
                      if not main_version:
                          print("Could not read version from origin/main (or origin/master).")
                          sys.exit(1)
                      version = main_version
                      if current_version != main_version:
                          print(
                              "Current branch version differs from origin/main. "
                              "Run the workflow on main or provide a version input."
                          )
                          sys.exit(1)

                  if tag and tag != f"v{version}":
                      print(f"Tag mismatch: expected v{version}, input is {tag}.")
                      sys.exit(1)

                  resolved_tag = tag or f"v{version}"

                  print(f"Resolved version={version}, tag={resolved_tag}")

                  out = os.environ.get("GITHUB_OUTPUT")
                  if not out:
                      print("GITHUB_OUTPUT is not set.")
                      sys.exit(1)
                  with open(out, "a", encoding="utf-8") as fh:
                      fh.write(f"version={version}\n")
                      fh.write(f"tag={resolved_tag}\n")
                  PY

            - name: Create and push tag (manual)
              if: github.event_name == 'workflow_dispatch'
              env:
                  RESOLVED_VERSION: ${{ steps.resolve.outputs.version }}
                  RESOLVED_TAG: ${{ steps.resolve.outputs.tag }}
              run: |
                  set -euo pipefail
                  TAG="${RESOLVED_TAG}"

                  git fetch --tags

                  if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                      echo "Tag $TAG already exists locally."
                      exit 1
                  fi

                  if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
                      echo "Tag $TAG already exists on origin."
                      exit 1
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git tag "$TAG"
                  git push origin "$TAG"

            - name: Build distribution
              run: uv build

            - name: Publish to PyPI
              run: uv publish --trusted-publishing always

    # A GitHub Release for every version that reached PyPI (2026-11-19). It runs only after the
    # publish job succeeds, so a Release never exists for a version PyPI does not have. Notes are
    # this tag's commits since the previous tag (bump and changelog commits left out) - the
    # changelog workflow writes CHANGELOG.md after the tag, so it is not ready in time. rc / a / b
    # versions are marked Pre-release. Re-running is safe: an existing Release is left alone.
    github-release:
        name: GitHub Release
        needs: pypi-publish
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Create the release from this tag's commits
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "Release $TAG already exists"
                      exit 0
                  fi
                  prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
                  range="$TAG"
                  if [ -n "$prev" ]; then range="$prev..$TAG"; fi
                  {
                      echo "## What's changed"
                      echo
                      git log "$range" --no-merges --pretty='- %s' | grep -v -E '^- (bump: |docs: update changelog)' || true
                      echo
                      if [ -n "$prev" ]; then
                          echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
                      fi
                  } > notes.md
                  pre=""
                  case "$TAG" in *rc*|*a[0-9]*|*b[0-9]*) pre="--prerelease" ;; esac
                  gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $pre
