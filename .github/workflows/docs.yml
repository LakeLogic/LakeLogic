name: Deploy Documentation

on:
    push:
        branches:
            - main
            - master

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  pip install .[docs]

            - name: Deploy to GitHub Pages
              run: |
                  mkdocs gh-deploy --force
