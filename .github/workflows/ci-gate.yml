name: 🧪 CI Quality Gate

on:
  # Run on all PRs to protected branches
  pull_request:
    branches: 
      - dev
      - stage
      - main
  
  # Also run on direct pushes to dev (for quick feedback)
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write  # To post comments on PRs

jobs:
  # Backend Python checks
  backend-quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      
      - name: Run Ruff Linter
        run: ruff check . --exclude _ref
      
      - name: Run Ruff Formatter Check
        run: ruff format --check . --exclude _ref

  # Frontend TypeScript/React checks
  frontend-quality:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app/frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/app/frontend/package-lock.json
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint || true  # Don't fail on lint warnings for now
      
      - name: TypeScript Type Check
        run: npx tsc --noEmit || true  # Don't fail on type errors for now
      
      - name: Build Check
        run: npm run build
