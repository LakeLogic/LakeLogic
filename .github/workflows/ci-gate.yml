name: CI Quality Gate

on:
  # Run on all PRs to protected branches
  pull_request:
    branches:
      - dev
      - stage
      - main

  # Also run on direct pushes to dev (for quick feedback)
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write
  pull-requests: write # To post comments on PRs

jobs:
  # Backend Python checks
  backend-quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          uv pip install --system ruff

      - name: Run Ruff Linter
        run: ruff check . --exclude _ref --output-format=concise

  # Core test suite
  tests:
    name: Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Project & Test Dependencies
        run: |
          uv pip install --system -e ".[dev,cli,engines]"
          uv pip install --system pytest pytest-cov

      - name: Run Tests
        run: pytest tests/ -q --tb=short --cov=lakelogic --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=25

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  # Contract validation
  contract-validation:
    name: Contract Validation
    runs-on: ubuntu-latest
    if: false  # Disabled — re-enable by removing this line
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LakeLogic
        run: |
          uv pip install --system -e ".[cli,engines]"

      - name: Validate Contracts
        run: |
          echo "Validating all contracts in the repository..."
          find examples \( -name "*.yaml" -o -name "*.yml" \) \
            ! -iname "*domain.yaml" ! -iname "*domain.yml" \
            ! -iname "*system.yaml" ! -iname "*system.yml" | while read contract; do
            echo "Validating: $contract"
            lakelogic validate --contract "$contract" || exit 1
          done
          echo "✅ All contracts validated successfully"

      - name: Check for Breaking Changes (gates enforcement)
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for contract breaking changes..."
          find examples \( -name "*.yaml" -o -name "*.yml" \) \
            ! -iname "*domain.yaml" ! -iname "*domain.yml" \
            ! -iname "*system.yaml" ! -iname "*system.yml" | while read contract; do
            echo "Checking breaking changes: $contract"
            lakelogic validate --contract "$contract" --gates breaking_change || echo "⚠️  Breaking change detected (informational only in this check)"
          done
