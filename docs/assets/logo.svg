<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" width="48" height="48">

  <!-- Background -->
  <rect width="48" height="48" rx="10" fill="#0D1117"/>
  <rect x="2" y="2" width="44" height="44" rx="8" fill="none" stroke="#0891b2" stroke-width="0.75" opacity="0.4"/>

  <!-- L normal - white - vertical stroke left, horizontal stroke bottom -->
  <rect x="10" y="10" width="5" height="28" rx="1.5" fill="#ffffff"/>
  <rect x="10" y="33" width="19" height="5" rx="1.5" fill="#ffffff"/>

  <!-- Reversed L - blue - vertical stroke right, horizontal stroke top -->
  <rect x="33" y="10" width="5" height="28" rx="1.5" fill="#0891b2"/>
  <rect x="19" y="10" width="19" height="5" rx="1.5" fill="#0891b2"/>

</svg>
