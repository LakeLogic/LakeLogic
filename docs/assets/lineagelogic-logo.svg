<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LineageLogic Logo: Data flow with connected nodes representing lineage tracking -->
  
  <!-- Background Circle -->
  <circle cx="24" cy="24" r="22" fill="url(#gradient2)" stroke="#2196F3" stroke-width="2"/>
  
  <!-- Data Flow Nodes (3 connected points) -->
  <circle cx="14" cy="24" r="4" fill="#2196F3"/>
  <circle cx="24" cy="16" r="4" fill="#00BCD4"/>
  <circle cx="34" cy="24" r="4" fill="#009688"/>
  
  <!-- Connection Lines (representing lineage) -->
  <path d="M14 24L24 16" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 16L34 24" stroke="#00BCD4" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 24L34 24" stroke="#009688" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.5"/>
  
  <!-- Directional Arrows -->
  <path d="M22 17L24 16L23 14" stroke="#00BCD4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 23L34 24L33 26" stroke="#009688" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient2" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2196F3" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
