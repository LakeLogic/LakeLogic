version: 1.0.0
dataset: silver_orders
primary_key: ["order_id"]

info:
  title: "Silver Orders"
  version: 1.0.0
  description: "Order data partitioned by region, merged on order_id."

source:
  type: file
  path: "data/"

model:
  fields:
    - name: order_id
      type: string
      required: true
      description: "Unique order identifier"
    - name: customer_id
      type: string
      required: true
    - name: region
      type: string
      required: true
      description: "Geographic region (US, EU, APAC)"
    - name: order_date
      type: date
    - name: amount
      type: decimal(10,2)
    - name: status
      type: string
      description: "pending, shipped, delivered, cancelled"

materialization:
  strategy: merge
  partition_by: ["region"]
  target_path: "data/silver/orders"
  format: parquet
