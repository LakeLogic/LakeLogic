version: 1.0.0
info:
  title: Policies (Silver)
  version: 1.0.0
  description: Cleansed policies with reference enrichment.
  owner: Insurance Data Platform
  status: active
  classification: PII
metadata:
  run_log_path: ../../../../output/run_logs/policies_silver.json
  run_log_table: lakelogic.run_logs
  run_log_backend: duckdb
  run_log_database: ../../../../output/run_logs/lakelogic_run_logs.duckdb
server:
  type: local
  path: ../../../../output/bronze/policy_admin_policies.parquet
  format: parquet
environments:
  dev:
    path: ../../../../output/bronze/policy_admin_policies.parquet
    format: parquet
links:
- name: ref_coverage
  type: parquet
  path: ../../../../output/silver/reference_coverage.parquet
- name: ref_states
  type: parquet
  path: ../../../../output/silver/reference_states.parquet
- name: ref_policyholders
  type: parquet
  path: ../../../../output/silver/reference_policyholders.parquet
dataset: silver_policies
primary_key:
- policy_id
schema_policy:
  evolution: strict
  unknown_fields: quarantine
model:
  fields:
  - name: policy_id
    type: string
    required: true
  - name: customer_id
    type: integer
    required: true
  - name: policy_number
    type: string
  - name: coverage_code
    type: string
  - name: coverage_type
    type: string
  - name: policy_status
    type: string
  - name: effective_date
    type: date
  - name: expiry_date
    type: date
  - name: premium_amount
    type: double
  - name: state_code
    type: string
  - name: state_name
    type: string
  - name: region
    type: string
  - name: first_name
    type: string
  - name: last_name
    type: string
  - name: policyholder_name
    type: string
  - name: updated_at
    type: timestamp
transformations:
- filter:
    sql: op <> 'D'
  phase: pre
- deduplicate:
    on:
    - policy_id
    sort_by:
    - updated_at
    order: desc
  phase: pre
- drop:
    columns:
    - op
- join:
    reference: ref_coverage
    on: coverage_code
    key: coverage_code
    fields:
    - coverage_type
    type: left
  phase: post
- join:
    reference: ref_policyholders
    on: customer_id
    key: customer_id
    fields:
    - state_code
    - first_name
    - last_name
    type: left
  phase: post
- join:
    reference: ref_states
    on: state_code
    key: state_code
    fields:
    - state_name
    - region
    type: left
  phase: post
- derive:
    field: policyholder_name
    sql: first_name || ' ' || last_name
quality:
  row_rules:
  - not_null: policy_id
  - accepted_values:
      field: policy_status
      values:
      - ACTIVE
      - CANCELLED
      - LAPSED
  - referential_integrity:
      field: customer_id
      reference: ref_policyholders
      key: customer_id
  dataset_rules:
  - unique: policy_id
lineage:
  enabled: true
materialization:
  strategy: overwrite
  target_path: ../../../../output/silver/policies
  format: parquet
quarantine:
  enabled: true
  strict_notifications: false
  include_error_reason: true
  target: ../../../../output/quarantine/policies
  notifications:
  - type: webhook
    target: env:LAKELOGIC_ALERT_WEBHOOK
    on_events:
    - quarantine
    - failure
source:
  type: landing
  path: ../../../../output/bronze
  load_mode: incremental
  pattern: policy_admin_policies*.parquet
  watermark_field: updated_at
upstream:
- silver_reference_coverage
- silver_reference_states
- silver_reference_policyholders
