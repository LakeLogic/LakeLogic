version: "1.0.0"
upstream: ["silver_events"]

info:
  title: "Tenant KPI — Daily Engagement (Gold)"
  version: "1.0.0"
  description: |
    Daily engagement KPIs per tenant: unique users, sessions, purchases,
    and page views. Fed into the tenant-facing analytics dashboard.
  owner: "Analytics Engineering"
  target_layer: "gold"

server:
  type: adls
  format: parquet
  path: "abfss://events@myaccount.dfs.core.windows.net/prod/default/gold/"

environments:
  dev-acme:
    path: "./data/dev/acme/gold_tenant_kpi.parquet"
  dev-globex:
    path: "./data/dev/globex/gold_tenant_kpi.parquet"
  test-acme:
    path: "abfss://events@myaccount.dfs.core.windows.net/test/acme/gold/"
  test-globex:
    path: "abfss://events@myaccount.dfs.core.windows.net/test/globex/gold/"
  prod-acme:
    path: "abfss://events@myaccount.dfs.core.windows.net/prod/acme/gold/"
  prod-globex:
    path: "abfss://events@myaccount.dfs.core.windows.net/prod/globex/gold/"

dataset: gold_tenant_kpi
primary_key: ["event_date", "tenant_id", "event_type"]

model:
  fields:
    - name: event_date
      type: date
    - name: tenant_id
      type: string
    - name: event_type
      type: string
    - name: unique_users
      type: integer
    - name: unique_sessions
      type: integer
    - name: event_count
      type: integer

transformations:
  - sql: |
      SELECT
        CAST(event_ts AS DATE)            AS event_date,
        tenant_id,
        event_type,
        COUNT(DISTINCT user_id)           AS unique_users,
        COUNT(DISTINCT session_id)        AS unique_sessions,
        COUNT(*)                          AS event_count
      FROM source
      GROUP BY CAST(event_ts AS DATE), tenant_id, event_type

quality:
  row_rules:
    - name: counts_positive
      sql: "event_count > 0 AND unique_users > 0"
      category: accuracy

  dataset_rules:
    - name: min_rows
      sql: "SELECT COUNT(*) FROM gold_tenant_kpi"
      must_be_greater_than: 0

service_levels:
  freshness:
    description: "Tenant KPIs must be available by 06:00 UTC for morning dashboards"
    threshold: 24h
    field: event_date

materialization:
  strategy: overwrite
  format: parquet
