version: 1.0.0
metadata:
  owner: data-platform@company.com
  policy_pack: shared_standard
  domain: growth
  system: app_events
schema_policy:
  evolution: strict
  unknown_fields: quarantine
quality:
  enforce_required: !!bool 'true'
  dataset_rules:
  - row_count_between:
      min: 1
      max: 1000000000
lineage:
  enabled: !!bool 'true'
  capture_domain: !!bool 'true'
  capture_system: !!bool 'true'
materialization:
  strategy: append
  format: parquet
  target_path: ../../output/silver/daily_metrics
info:
  title: Silver Daily Metrics
  version: 1.0.0
  target_layer: silver
dataset: silver_daily_metrics
source:
  type: landing
  path: ../../data/daily_metrics.csv
  load_mode: full
model:
  fields:
  - name: metric_date
    type: string
  - name: user_id
    type: string
    required: !!bool 'true'
  - name: metric
    type: string
  - name: value
    type: double
transformations:
- unpivot:
    id_vars:
    - metric_date
    - user_id
    value_vars:
    - clicks
    - impressions
    - conversions
    key_field: metric
    value_field: value
    include_nulls: !!bool 'false'
  phase: pre
