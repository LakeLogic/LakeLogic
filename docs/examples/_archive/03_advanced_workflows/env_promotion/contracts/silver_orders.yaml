version: "1.0.0"
upstream: ["bronze_orders"]

info:
  title: "Cleaned Orders (Silver)"
  version: "1.0.0"
  description: |
    Validated and enriched orders. Adds revenue field, normalises status codes,
    and enforces business completeness rules before Gold aggregation.
  owner: "Data Engineering"
  target_layer: "silver"
  status: active

# Production sink — used when LAKELOGIC_ENV is unset
server:
  type: adls
  format: parquet
  path: "abfss://silver@myaccount.dfs.core.windows.net/prod/orders/"
  mode: ingest
  schema_evolution: strict

# Per-environment overrides
environments:
  dev:
    path: "./data/silver_orders.parquet"
  test:
    path: "abfss://silver@myaccount.dfs.core.windows.net/test/orders/"

source:
  type: landing
  path: "./data/bronze_orders.parquet"    # dev: reads local bronze output

dataset: silver_orders
primary_key: ["order_id"]

schema_policy:
  evolution: strict
  unknown_fields: quarantine

model:
  fields:
    - name: order_id
      type: string
    - name: customer_id
      type: string
    - name: product_id
      type: string
    - name: quantity
      type: integer
    - name: unit_price
      type: double
    - name: revenue
      type: double
      description: "quantity × unit_price (derived)"
    - name: order_date
      type: date
    - name: status
      type: string
    - name: country
      type: string

transformations:
  # Derive revenue
  - derive:
      field: revenue
      sql: "CAST(quantity AS DOUBLE) * unit_price"

  # Normalise status to lowercase
  - sql: |
      SELECT
        order_id,
        customer_id,
        product_id,
        quantity,
        unit_price,
        revenue,
        order_date,
        LOWER(status) AS status,
        country
      FROM source

quality:
  row_rules:
    - name: revenue_positive
      sql: "revenue > 0"
      category: validity

    - name: order_date_not_null
      sql: "order_date IS NOT NULL"
      category: completeness

    - name: valid_country
      sql: "country IS NOT NULL AND LENGTH(country) = 2"
      category: validity

  dataset_rules:
    - name: no_duplicate_orders
      sql: "SELECT COUNT(*) - COUNT(DISTINCT order_id) FROM silver_orders"
      must_be_less_than: 1

    - name: min_order_volume
      description: "Warn if fewer than 10 orders processed — likely a source gap"
      sql: "SELECT COUNT(*) FROM silver_orders"
      must_be_greater_than: 9

materialization:
  strategy: overwrite
  format: parquet
  target_path: "./data/silver_orders.parquet"

quarantine:
  enabled: true
  include_error_reason: true
  target: "./data/quarantine/silver_orders/"
