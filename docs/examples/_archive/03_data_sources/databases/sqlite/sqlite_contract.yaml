version: 1.0.0
dataset: bronze_sqlite_users
description: SQLite extraction example
source:
  type: database
  connector: sqlite
  connection:
    database: example.db
  table: users
model:
  fields:
  - name: id
    type: integer
  - name: name
    type: string
  - name: email
    type: string
quality:
  row_rules:
  - not_null:
      field: email
      name: email_not_null
      severity: warning
materialization:
  good:
    enabled: true
    path: ./data/bronze/sqlite_users/
    format: delta
    mode: overwrite
