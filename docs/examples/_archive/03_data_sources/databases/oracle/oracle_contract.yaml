version: 1.0.0
dataset: bronze_oracle_orders
description: Oracle extraction example
source:
  type: database
  connector: oracle
  connection:
    host: localhost
    port: 1521
    service_name: ORCL
    username: env:ORACLE_USER
    password: env:ORACLE_PASSWORD
  table: ORDERS
model:
  fields:
  - name: ORDER_ID
    type: integer
  - name: CUSTOMER_ID
    type: integer
  - name: ORDER_DATE
    type: date
  - name: TOTAL_AMOUNT
    type: decimal
quality:
  row_rules:
  - not_null:
      field: ORDER_ID
      name: order_id_not_null
      severity: error
materialization:
  good:
    enabled: true
    path: s3://datalake/bronze/oracle_orders/
    format: delta
    mode: append
