version: 1.0.0
dataset: bronze_customers
description: Bronze layer customers from Azure SQL (CDC)
source:
  type: database
  connector: azuresql
  server: myserver.database.windows.net
  database: production_db
  table: dbo.customers
  cdc:
    enabled: true
    watermark_column: updated_at
    watermark_type: timestamp
model:
  fields:
  - name: customer_id
    type: integer
  - name: email
    type: string
  - name: status
    type: string
  - name: created_at
    type: timestamp
  - name: updated_at
    type: timestamp
quality:
  row_rules:
  - not_null:
      field: customer_id
      name: customer_id_not_null
      severity: error
  - not_null:
      field: email
      name: email_not_null
      severity: error
materialization:
  good:
    enabled: true
    path: s3://datalake/bronze/customers/
    format: delta
    mode: append
  quarantine:
    enabled: true
    path: s3://datalake/quarantine/customers/
    format: delta
    mode: append
