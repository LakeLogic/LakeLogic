version: 1.0.0
dataset: kafka_user_events
source:
  type: stream
  connector: kafka
  config:
    brokers:
    - localhost:9092
    topic: user-events
    consumer_group: lakelogic-consumer-group
    auto_offset_reset: earliest
schema:
  fields:
  - name: userId
    type: string
    required: true
  - name: eventType
    type: string
    required: true
  - name: eventData
    type: object
    required: true
  - name: timestamp
    type: timestamp
    required: true
  - name: sessionId
    type: string
    required: false
  - name: ipAddress
    type: string
    required: false
quality:
  rules:
  - name: valid_event_type
    type: allowed_values
    column: eventType
    allowed:
    - login
    - logout
    - purchase
    - view
    - click
    - search
    severity: error
  - name: recent_event
    type: custom
    expression: pl.col('timestamp') > pl.datetime(2024, 1, 1)
    severity: warning
  - name: valid_user_id
    type: regex
    column: userId
    pattern: ^USER-[0-9]{6}$
    severity: error
materialization:
  strategy: append
  path: ./data/bronze/kafka_events/
  format: delta
  partition_by:
  - eventType
