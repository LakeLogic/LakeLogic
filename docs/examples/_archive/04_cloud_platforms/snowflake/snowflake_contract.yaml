version: 1.0.0
dataset: snowflake_orders
description: "Snowflake extraction example"

source:
  type: database
  connector: snowflake
  connection:
    account: "env:SNOWFLAKE_ACCOUNT"
    user: "env:SNOWFLAKE_USER"
    password: "env:SNOWFLAKE_PASSWORD"
    warehouse: "env:SNOWFLAKE_WAREHOUSE"
    database: "ANALYTICS"
    schema: "PUBLIC"
  table: ORDERS

model:
  fields:
    - name: ORDER_ID
      type: integer
    - name: CUSTOMER_ID
      type: integer
    - name: ORDER_DATE
      type: date
    - name: TOTAL_AMOUNT
      type: decimal

quality:
  row_rules:
    - name: order_id_not_null
      rule: not_null
      column: ORDER_ID
      severity: error
