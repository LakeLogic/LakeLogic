version: 1.0.0
dataset: fabric_orders
description: "Fabric LakeDB validation example"

source:
  type: delta
  path: "onelake://workspace/lakehouse/tables/orders"

model:
  fields:
    - name: order_id
      type: integer
    - name: customer_id
      type: integer
    - name: order_date
      type: date
    - name: total_amount
      type: decimal

quality:
  row_rules:
    - name: order_id_not_null
      rule: not_null
      column: order_id
      severity: error

materialization:
  good:
    enabled: true
    path: onelake://workspace/lakehouse/tables/orders_validated
    format: delta
    mode: append
