version: 1.0.0
dataset: silver_orders_enriched

info:
  title: Orders Enriched (Silver)
  table_name: "{silver_layer}_{system}_orders_enriched"
  description: >
    Enriched order data with computed line totals, customer segment,
    and PII fields carried through for masking demonstration.
  target_layer: silver
  domain: crm
  system: webshop

primary_key:
  - order_id

model:
  fields:
    - name: order_id
      type: string
      primary_key: true
    - name: customer_id
      type: string
      required: true
    - name: order_date
      type: string
      required: true
    - name: product_name
      type: string
    - name: category
      type: string
    - name: quantity
      type: integer
      required: true
    - name: unit_price
      type: double
      required: true
    - name: discount_pct
      type: double
    - name: line_total
      type: double
      description: "quantity * unit_price * (1 - discount_pct)."
    - name: channel
      type: string
    - name: status
      type: string
    - name: customer_name
      type: string
      pii: true
      masking: redact
      description: "Customer name (PII — redacted)."
    - name: customer_email
      type: string
      pii: true
      masking: hash
      description: "Customer email (PII — hashed)."
    - name: customer_segment
      type: string
      description: "Customer segment from the customers table."
    - name: customer_country
      type: string

source:
  type: landing
  path: "lakehouse/{domain}/{bronze_layer}_{system}_orders"
  format: delta

# ── SQL Transformations ─────────────────────────────────────────────────────
# These run in DuckDB natively when using the duckdb engine
transformations:
  # Filter out invalid orders - orders with no status
  - phase: pre
    filter: "status is not null"
    
  - phase: pre
    description: "Remove duplicate orders"
    sql: >
      select * from (
        SELECT *, row_number() OVER (PARTITION BY order_id ORDER BY order_date desc) as rn
        FROM source o
      ) where rn = 1  

  # Compute line_total and enrich with customer data (including PII)
  - phase: post
    sql: >
      SELECT
        o.order_id,
        o.customer_id,
        o.order_date,
        o.product_name,
        o.category,
        o.quantity,
        o.unit_price,
        o.discount_pct,
        ROUND(o.quantity * o.unit_price * (1.0 - COALESCE(o.discount_pct, 0)), 2) AS line_total,
        o.channel,
        o.status,
        c.name AS customer_name,
        c.email AS customer_email,
        COALESCE(c.segment, 'unknown') AS customer_segment,
        COALESCE(c.country, 'unknown') AS customer_country
      FROM source o
      LEFT JOIN customers c ON o.customer_id = c.customer_id

# Link to customers table for the JOIN
links:
  - name: customers
    path: "lakehouse/{domain}/{silver_layer}_{system}_customers"
    type: delta
    columns: [customer_id, name, email, segment, country]

quality:
  row_rules:
    - name: positive_line_total
      sql: "line_total > 0"
      category: validity
    - name: known_segment
      sql: "customer_segment IN ('premium', 'standard', 'new', 'unknown')"
      category: consistency
