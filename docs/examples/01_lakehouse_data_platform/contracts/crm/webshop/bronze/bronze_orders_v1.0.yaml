version: 1.0.0
dataset: bronze_orders

info:
  title: Webshop Orders (Bronze)
  table_name: "{bronze_layer}_{system}_orders"
  description: "Raw e-commerce order data. One row per order line item."
  target_layer: bronze
  domain: crm
  system: webshop

model:
  fields:
    - name: order_id
      type: string
      required: true
      description: "Unique order identifier."
    - name: customer_id
      type: string
      required: true
      description: "FK to customers table."
    - name: order_date
      type: string
      required: true
      description: "Order date (YYYY-MM-DD)."
    - name: product_name
      type: string
    - name: category
      type: string
    - name: quantity
      type: integer
    - name: unit_price
      type: double
    - name: discount_pct
      type: double
      description: "Discount percentage (0.0 to 1.0)."
    - name: channel
      type: string
      description: "Sales channel: web, mobile, store."
    - name: status
      type: string
      description: "Order status: completed, pending, cancelled, returned."

source:
  type: landing
  path: "landing_crm/webshop/orders"
  format: csv
  options:
    header: "true"
    recursiveFileLookup: "true"
  partition:
    format: "y_%Y/m_%m/d_%d"
