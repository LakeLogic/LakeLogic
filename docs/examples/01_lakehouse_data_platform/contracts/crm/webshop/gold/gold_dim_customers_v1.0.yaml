version: 1.0.0
dataset: gold_dim_customers

info:
  title: Customer Dimension SCD2 (Gold)
  table_name: "{gold_layer}_{system}_dim_customers"
  description: >
    Slowly Changing Dimension Type 2 for customer master data.
    Tracks historical changes to segment, country, name, and email
    with full versioning, effective date ranges, and a current-row flag.
  target_layer: gold
  domain: crm
  system: webshop

primary_key:
  - customer_sk

natural_key:
  - customer_id

model:
  fields:
    # ── Surrogate key (auto-generated by SCD2 materializer) ──
    - name: customer_sk
      type: string
      primary_key: true
      generated: true
      description: "Surrogate key (hash of customer_id + effective_from)."

    # ── Business key ──
    - name: customer_id
      type: string
      required: true
      description: "Natural business key — stable across SCD2 versions."

    # ── Tracked attributes ──
    - name: name
      type: string
      description: "Customer full name (PII — redacted). Tracked for SCD2."
    - name: email
      type: string
      description: "Customer email (PII — hashed). Tracked for SCD2."
    - name: phone
      type: string
      description: "Phone number (PII — masked)."
    - name: country
      type: string
      description: "Customer country. Tracked for SCD2."
    - name: segment
      type: string
      description: "Normalised customer segment. Tracked for SCD2."
    - name: signup_date
      type: string

    # ── SCD2 control columns (auto-injected by materializer) ──
    - name: effective_from
      type: timestamp
      generated: true
      description: "Row validity start (inclusive)."
    - name: effective_to
      type: timestamp
      generated: true
      description: "Row validity end. 9999-12-31 for the current version."
    - name: is_current
      type: boolean
      generated: true
      description: "True for the latest version of each customer."
    - name: _version
      type: integer
      generated: true
      description: "Monotonically increasing version number per customer_id."

source:
  type: landing
  path: "lakehouse/{domain}/{silver_layer}_{system}_customers"
  format: delta

quality:
  row_rules:
    - name: has_business_key
      sql: "customer_id IS NOT NULL"
      category: completeness
  dataset_rules:
    - name: has_rows
      sql: "SELECT COUNT(*) FROM {dataset}"
      must_be_greater_than: 0

materialization:
  strategy: scd2
  scd2:
    business_key: customer_id
    track_columns:
      - name
      - email
      - country
      - segment
    timestamp_field: _lakelogic_processed_at
    surrogate_key: customer_sk
    effective_from_field: effective_from
    effective_to_field: effective_to
    effective_to_default: "9999-12-31"
    current_flag_field: is_current
    version_column: _version


downstream:
  - type: api
    name: "Customer Lookup Service"
    platform: internal
    owner: "backend-team"