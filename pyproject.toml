[project]
name = "lakeguard"
version = "0.1.0"
description = "A Python-based data contract runtime for consistent quality across engines."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "LakeGuard Team", email = "hello@lakeguard.io" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "sqlglot>=20.0.0",
    "polars>=0.20.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
polars = ["polars>=0.20.0"]
pandas = ["pandas>=2.0.0", "duckdb>=0.9.0"]
duckdb = ["duckdb>=0.9.0"]
spark = ["pyspark>=3.3.0"]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
    "mkdocs-jupyter>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
all = [
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "duckdb>=0.9.0",
    "pyspark>=3.3.0",
]

[project.scripts]
lakeguard = "lakeguard.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakeguard"]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
]
