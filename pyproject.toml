[project]
name = "lakelogic"
version = "0.1.0b1"
description = "A Python-based data contract runtime for consistent quality across engines."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "LakeLogic Team", email = "hello@lakelogic.io" }]
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "sqlglot>=20.0.0",
    "polars>=0.20.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
polars = ["polars>=0.20.0", "deltalake>=0.15.0"]
pandas = ["pandas>=2.0.0", "duckdb>=0.9.0", "deltalake>=0.15.0"]
duckdb = ["duckdb>=0.9.0", "pandas>=2.0.0", "pyarrow>=14.0.0", "deltalake>=0.15.0"]
spark = ["pyspark>=3.3.0"]
snowflake = ["snowflake-connector-python>=3.5.0"]
bigquery = ["google-cloud-bigquery>=3.11.0"]
notebook = ["nbclient>=0.9.0", "nbformat>=5.9.0"]
profiling = ["dataprofiler>=0.9.0", "presidio-analyzer>=2.2.0"]
notifications = [
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    "boto3>=1.28.0",
    "google-cloud-secret-manager>=2.16.0",
    "hvac>=2.0.0",
    "cryptography>=41.0.0",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
    "mkdocs-jupyter>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]
all = [
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "deltalake>=0.15.0",
    "pyspark>=3.3.0",
    "snowflake-connector-python>=3.5.0",
    "google-cloud-bigquery>=3.11.0",
    "nbclient>=0.9.0",
    "nbformat>=5.9.0",
    "dataprofiler>=0.9.0",
    "presidio-analyzer>=2.2.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    "boto3>=1.28.0",
    "google-cloud-secret-manager>=2.16.0",
    "hvac>=2.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
lakelogic = "lakelogic.cli.main:app"
lakelogic-driver = "lakelogic.cli.driver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakelogic"]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
]
