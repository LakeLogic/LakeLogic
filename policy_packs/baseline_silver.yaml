name: baseline_silver
defaults:
  schema_policy:
    evolution: strict
    unknown_fields: quarantine
  lineage:
    enabled: true
    capture_contract_name: true
  quarantine:
    enabled: true
    include_error_reason: true
  metadata:
    approval_required: false
silver_defaults:
  quality:
    row_rules:
      - not_null: policy_id
    dataset_rules:
      - null_ratio:
          field: policy_id
          max: 0.01
service_levels:
  freshness:
    field: updated_at
    threshold: 24h
