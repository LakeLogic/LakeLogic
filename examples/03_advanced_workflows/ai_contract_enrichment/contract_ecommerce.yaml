version: "1.0.0"
info:
  title: "E-Commerce Orders"
  version: "1.0.0"
  description: "Raw e-commerce order data — ripe for AI enrichment."
  owner: data-platform-team

model:
  fields:
    - name: order_id
      type: string
      required: true
    - name: customer_email
      type: string
      required: true
    - name: customer_name
      type: string
    - name: phone_number
      type: string
    - name: shipping_address
      type: string
    - name: city
      type: string
    - name: country
      type: string
    - name: postcode
      type: string
    - name: status
      type: string
      required: true
    - name: payment_method
      type: string
    - name: amount
      type: double
      required: true
    - name: tax_rate
      type: double
    - name: discount_pct
      type: double
    - name: quantity
      type: integer
    - name: order_date
      type: date
    - name: delivery_date
      type: date
    - name: is_gift
      type: boolean
    - name: notes
      type: string
    - name: ip_address
      type: string

source:
  type: landing
  path: "data/raw_orders.csv"
  load_mode: full

# These rules are INTENTIONALLY minimal — the AI will suggest better ones
quality:
  row_rules:
    - sql: "order_id IS NOT NULL"
    - sql: "amount > 0"

materialization:
  strategy: append
  target_path: "output/silver/orders"
  format: parquet

quarantine:
  enabled: true
  target: "output/quarantine/orders"
