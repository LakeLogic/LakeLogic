version: 1.0.0
dataset: streaming_events

info:
  title: "Streaming Event Processor"
  version: 1.0.0
  description: "Contract for processing large event files via Polars streaming."

model:
  fields:
    - name: event_id
      type: string
      required: true
    - name: event_type
      type: string
      required: true
    - name: user_id
      type: string
    - name: timestamp
      type: timestamp
    - name: value
      type: float
    - name: metadata
      type: string

quality:
  rules:
    - field: value
      operator: ">="
      value: 0
      description: "Value must be non-negative"
