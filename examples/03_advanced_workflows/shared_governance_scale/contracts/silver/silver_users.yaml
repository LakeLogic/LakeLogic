version: 1.0.0
metadata:
  owner: data-platform@company.com
  policy_pack: shared_standard
  domain: growth
  system: app_events
schema_policy:
  evolution: strict
  unknown_fields: quarantine
quality:
  enforce_required: !!bool 'true'
  dataset_rules:
  - row_count_between:
      min: 1
      max: 1000000000
lineage:
  enabled: !!bool 'true'
  capture_domain: !!bool 'true'
  capture_system: !!bool 'true'
materialization:
  strategy: append
  format: parquet
  target_path: ../../output/silver/users
info:
  title: Silver Users
  version: 1.0.0
  target_layer: silver
dataset: silver_users
source:
  type: landing
  path: ../../data/users.csv
  load_mode: full
model:
  fields:
  - name: user_id
    type: string
    required: !!bool 'true'
  - name: email
    type: string
  - name: status
    type: string
  - name: updated_at
    type: timestamp
transformations:
- deduplicate:
    on:
    - user_id
    sort_by:
    - updated_at
    order: desc
  phase: pre
