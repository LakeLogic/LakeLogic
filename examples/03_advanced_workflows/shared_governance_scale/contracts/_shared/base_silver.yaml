version: "1.0.0"
metadata:
  owner: data-platform@company.com
  policy_pack: shared_standard
schema_policy:
  evolution: strict
  unknown_fields: quarantine
quality:
  enforce_required: true
  dataset_rules:
    - row_count_between:
        min: 1
        max: 1000000000
lineage:
  enabled: true
  capture_domain: true
  capture_system: true
materialization:
  strategy: append
  format: parquet
