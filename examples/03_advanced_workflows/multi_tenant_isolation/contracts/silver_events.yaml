version: "1.0.0"
upstream: ["bronze_events"]

info:
  title: "Enriched Clickstream Events (Silver)"
  version: "1.0.0"
  description: |
    Cleaned, deduplicated, and enriched events. Adds event_hour for
    hourly aggregation and enforces business completeness rules.
  owner: "Platform Data Engineering"
  target_layer: "silver"

server:
  type: adls
  format: parquet
  path: "abfss://events@myaccount.dfs.core.windows.net/prod/default/silver/"
  mode: ingest
  schema_evolution: strict

environments:
  dev-acme:
    path: "./data/dev/acme/silver_events.parquet"
  dev-globex:
    path: "./data/dev/globex/silver_events.parquet"
  test-acme:
    path: "abfss://events@myaccount.dfs.core.windows.net/test/acme/silver/"
  test-globex:
    path: "abfss://events@myaccount.dfs.core.windows.net/test/globex/silver/"
  prod-acme:
    path: "abfss://events@myaccount.dfs.core.windows.net/prod/acme/silver/"
  prod-globex:
    path: "abfss://events@myaccount.dfs.core.windows.net/prod/globex/silver/"

dataset: silver_events
primary_key: ["event_id"]

model:
  fields:
    - name: event_id
      type: string
    - name: tenant_id
      type: string
    - name: user_id
      type: string
      pii: true
    - name: session_id
      type: string
    - name: event_type
      type: string
    - name: page_url
      type: string
    - name: event_ts
      type: timestamp
    - name: event_hour
      type: integer
      description: "Hour-of-day (0–23) derived from event_ts — used for heatmap analytics"

transformations:
  - derive:
      field: event_hour
      sql: "EXTRACT(HOUR FROM CAST(event_ts AS TIMESTAMP))"

  # Deduplicate on event_id keeping latest
  - deduplicate:
      on: ["event_id"]
      sort_by: ["event_ts"]
      order: "desc"

quality:
  row_rules:
    - name: user_id_not_null
      sql: "user_id IS NOT NULL"
      category: completeness

    - name: valid_hour
      sql: "event_hour BETWEEN 0 AND 23"
      category: validity

  dataset_rules:
    - name: min_event_volume
      description: "Warn if fewer than 5 events — likely source gap or new tenant"
      sql: "SELECT COUNT(*) FROM silver_events"
      must_be_greater_than: 4

materialization:
  strategy: overwrite
  format: parquet

quarantine:
  enabled: true
  include_error_reason: true
  target: "./data/quarantine/silver_events/"
