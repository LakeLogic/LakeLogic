version: 1.0.0
info:
  title: Payments (Silver)
  version: 1.0.0
  description: Cleansed payments with policy validation.
  owner: Billing Data Team
  status: active
  classification: Financial
metadata:
  run_log_path: ../../../../output/run_logs/payments_silver.json
  run_log_table: lakelogic.run_logs
  run_log_backend: duckdb
  run_log_database: ../../../../output/run_logs/lakelogic_run_logs.duckdb
server:
  type: local
  path: ../../../../output/bronze/payments.parquet
  format: parquet
environments:
  dev:
    path: ../../../../output/bronze/payments.parquet
    format: parquet
links:
- name: silver_policies
  type: parquet
  path: ../../../../output/silver/policies.parquet
dataset: silver_payments
primary_key:
- payment_id
schema_policy:
  evolution: strict
  unknown_fields: quarantine
model:
  fields:
  - name: payment_id
    type: string
    required: true
  - name: policy_id
    type: string
  - name: customer_id
    type: integer
  - name: payment_date
    type: date
  - name: payment_amount
    type: double
  - name: payment_method
    type: string
  - name: updated_at
    type: timestamp
transformations:
- filter:
    sql: op <> 'D'
  phase: pre
- deduplicate:
    on:
    - payment_id
    sort_by:
    - updated_at
    order: desc
  phase: pre
- drop:
    columns:
    - op
quality:
  row_rules:
  - not_null: payment_id
  - accepted_values:
      field: payment_method
      values:
      - CARD
      - ACH
      - CHECK
  - referential_integrity:
      field: policy_id
      reference: silver_policies
      key: policy_id
  dataset_rules:
  - unique: payment_id
lineage:
  enabled: true
materialization:
  strategy: overwrite
  target_path: ../../../../output/silver/payments
  format: parquet
quarantine:
  enabled: true
  strict_notifications: false
  include_error_reason: true
  target: ../../../../output/quarantine/payments_silver
  notifications:
  - type: webhook
    target: env:LAKELOGIC_ALERT_WEBHOOK
    on_events:
    - quarantine
    - failure
source:
  type: landing
  path: ../../../../output/bronze
  load_mode: incremental
  pattern: payments*.parquet
  watermark_field: updated_at
upstream:
- silver_policies
