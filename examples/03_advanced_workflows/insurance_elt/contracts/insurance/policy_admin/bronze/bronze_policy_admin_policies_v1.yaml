version: 1.0.0
info:
  title: Policy Admin CDC (Bronze)
  version: 1.0.0
  description: CDC feed from Policy Admin system for insurance policies.
  owner: Insurance Data Platform
  status: active
  classification: PII
metadata:
  run_log_path: ../../../../output/run_logs/policy_admin_bronze.json
  notifications_note: Use env-based webhook targets in prod.
  run_log_table: lakelogic.run_logs
  run_log_backend: duckdb
  run_log_database: ../../../../output/run_logs/lakelogic_run_logs.duckdb
server:
  type: local
  path: ../../../../data/bronze/policy_admin_policies_cdc.csv
  format: csv
  mode: ingest
  schema_evolution: strict
  allow_schema_drift: false
  cast_to_string: false
environments:
  dev:
    path: ../../../../data/bronze/policy_admin_policies_cdc.csv
    format: csv
dataset: bronze_policy_admin_policies
primary_key:
- policy_id
schema_policy:
  evolution: strict
  unknown_fields: quarantine
model:
  fields:
  - name: policy_id
    type: string
    required: true
  - name: customer_id
    type: integer
    required: true
  - name: policy_number
    type: string
  - name: coverage_code
    type: string
  - name: policy_status
    type: string
  - name: effective_date
    type: date
  - name: expiry_date
    type: date
  - name: premium_amount
    type: double
  - name: updated_at
    type: timestamp
  - name: op
    type: string
transformations:
- filter:
    sql: op <> 'D'
  phase: pre
- deduplicate:
    on:
    - policy_id
    sort_by:
    - updated_at
    order: desc
  phase: pre
quality:
  row_rules:
  - not_null: policy_id
  - accepted_values:
      field: op
      values:
      - I
      - U
      - D
  - regex_match:
      field: policy_number
      pattern: ^PN-\d+$
  dataset_rules:
  - unique: policy_id
lineage:
  enabled: true
materialization:
  strategy: append
  target_path: ../../../../output/bronze/policy_admin_policies
  format: parquet
quarantine:
  enabled: true
  strict_notifications: false
  include_error_reason: true
  target: ../../../../output/quarantine/policy_admin
  notifications:
  - type: webhook
    target: env:LAKELOGIC_ALERT_WEBHOOK
    on_events:
    - quarantine
    - failure
source:
  type: landing
  path: ../../../../data/bronze
  load_mode: cdc
  pattern: policy_admin_policies_cdc*.csv
  watermark_field: updated_at
  cdc_op_field: op
  cdc_delete_values:
  - D
