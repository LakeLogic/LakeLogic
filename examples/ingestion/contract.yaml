version: 1.0.0
info:
  title: CRM Ingestion (Bronze)
  version: 1.0.0
  description: |
    Ingest CRM export files into Bronze with strict schema protection.

dataset: bronze_crm_users

schema_policy:
  evolution: strict
  unknown_fields: drop

model:
  fields:
    - name: user_id
      type: integer
      required: true
    - name: signup_date
      type: date
    - name: email
      type: string

quarantine:
  enabled: true
  include_error_reason: true
