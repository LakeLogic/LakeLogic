version: 1.0.0
info:
  title: "Silver \u2014 Stripe Payouts"
  table_name: '{silver_layer}_stripe_payouts'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: payments
  system: stripe
model:
  fields:
  - name: payout_id
    type: string
    required: true
  - name: driver_id
    type: string
    required: true
  - name: amount
    type: float
  - name: currency
    type: string
  - name: status
    type: string
  - name: payout_email
    type: string
    pii: true
    masking: hash
  - name: bank_account_last_four
    type: string
    pii: true
    masking: hash
  - name: arrival_date
    type: timestamp
  - name: created_at
    type: timestamp
quality:
  row_rules: []
  dataset_rules:
  - unique: payout_id
transformations:
- deduplicate:
    by:
    - payout_id
    sort_by: [created_at]
    order: desc
source:
  type: delta
  path: '{storage_root}/{domain}/{storage_root}/{domain}/{bronze_layer}_{system}_payouts'
