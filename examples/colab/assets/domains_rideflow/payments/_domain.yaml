domain: payments

# ── Domain Ownership ────────────────────────────────────────────────────────
ownership:
  domain_owner: "Finance Engineering"
  team: finance_engineering
  contacts:
    - name: Finance Data Lead
      role: oncall
      email: finance-data@rideflow.com
  cost_center: finance_ops
  jira_project: PAYMENTS

# ── Service Level Objectives (SLOs) ──────────────────────────────────────
slo:
  freshness:
    bronze:
      max_delay_minutes: 60
      check_column: "_lakelogic_loaded_at"
      max_source_delay_minutes: 120
    silver:
      max_delay_minutes: 240
      check_column: "_lakelogic_processed_at"
      max_source_delay_minutes: 300

  row_count:
    bronze:
      min_rows: 1
      max_rows: 200000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: "median"
        min_runs_before_enforcement: 5
    silver:
      min_rows: 1
      max_rows: 200000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: "median"
        min_runs_before_enforcement: 5

  quality:
    min_good_ratio: 0.99
    max_quarantine_ratio: 0.01
    by_severity:
      critical:
        min_good_ratio: 0.9999
      high:
        min_good_ratio: 0.999
      medium:
        min_good_ratio: 0.99
      low:
        min_good_ratio: 0.95

  schedule:
    environments: ["dev", "prod", "staging"]
    expected_start_utc: "05:00"
    expected_completion_utc: "06:00"
    expected_duration_minutes: 20
    warn_if_duration_exceeds_minutes: 45
    timezone: "UTC"

# ── Cost Governance ──────────────────────────────────────────────────────────
cost:
  currency: "GBP"
  budget:
    daily_limit: 25.00
    weekly_limit: 125.00
    monthly_limit: 400.00
    per_run_anomaly_multiplier: 3.0
    alert_channels: ["slack", "email"]

# ── Observatory Telemetry ────────────────────────────────────────────────────
observatory:
  enabled: true
  endpoint: "http://localhost:8001/api/v1/operations/run-logs/ingest"  # e.g., "${LAKELOGIC_OBSERVATORY_ENDPOINT}"
  api_key: "233rwejkkioasdaskasasp"   # e.g., "${LAKELOGIC_API_KEY}" for prod
  emit_on: [success, partial, failed]
  include_quarantine_sample: true     # attach first 50 quarantined rows

# ── Compliance & Privacy ─────────────────────────────────────────────────────
compliance:
  erasure:
    strategy: hash   # financial PII requires pseudonymization for audit trails

# Layer aliases
bronze_layer: bronze
silver_layer: silver
gold_layer: gold

