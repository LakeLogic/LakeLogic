version: 1.0.0
info:
  title: "Bronze — Checkr Driver Licences Unstructured"
  table_name: "{bronze_layer}_{system}_driver_licences"
  description: "Driver licence details, as already extracted from the licence documents (file_path names each source document)."
  target_layer: bronze
  domain: operations
  system: checkr

dataset: "driver_licences"

source:
  type: landing
  path: "{landing_root}/driver_licences"
  format: csv

model:
  fields:
    - name: file_path
      type: string

    - name: full_name
      type: string
      required: true
      
    - name: licence_number
      type: string
      required: true
      
    - name: date_of_birth
      type: date
      
    - name: expiry_date
      type: date
      
    - name: vehicle_classes
      type: string

quality:
  row_rules:
    - not_null: licence_number

lineage:
  enabled: true
