version: 1.0.0
info:
  title: "Silver \u2014 Zendesk Support Tickets"
  table_name: '{silver_layer}_zendesk_support_tickets'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: operations
  system: zendesk
model:
  fields:
  - name: ticket_id
    type: string
    required: true
  - name: requester_email
    type: string
    required: true
    pii: true
    masking: hash
  - name: requester_name
    type: string
    pii: true
    masking: redact
  - name: requester_phone
    type: string
    pii: true
    masking: redact
  - name: subject
    type: string
  - name: ticket_description
    type: string
    pii: true
    masking: hash
  - name: status
    type: string
  - name: priority
    type: string
  - name: channel
    type: string
  - name: assignee
    type: string
  - name: tags_json
    type: string
  - name: created_at
    type: timestamp
  - name: updated_at
    type: timestamp
  - name: solved_at
    type: timestamp
  - name: satisfaction_rating
    type: float
quality:
  row_rules: []
  dataset_rules:
  - unique: ticket_id
transformations:
- deduplicate:
    by:
    - ticket_id
source:
  type: delta
  path: '{storage_root}/{domain}/{storage_root}/{domain}/{bronze_layer}_{system}_support_tickets'
