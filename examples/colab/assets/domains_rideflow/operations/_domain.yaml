domain: operations

# ── Domain Ownership ────────────────────────────────────────────────────────
ownership:
  domain_owner: "Trust & Safety Team"
  team: trust_and_safety
  contacts:
  - name: Trust & Safety Data Lead
    role: oncall
    email: trust-safety-data@rideflow.com
  cost_center: trust_safety
  jira_project: OPSDATA

# ── Service Level Objectives (SLOs) ──────────────────────────────────────
slo:
  freshness:
    bronze:
      max_delay_minutes: 120
      check_columns: ["_lakelogic_processed_at"]
    silver:
      max_delay_minutes: 360
      check_columns: ["_lakelogic_processed_at"]
  row_count:
    bronze:
      min_rows: 1
      max_rows: 100000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: "median"
        min_runs_before_enforcement: 5
    silver:
      min_rows: 1
      max_rows: 100000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: "median"
        min_runs_before_enforcement: 5

  quality:
    min_good_ratio: 0.95
    max_quarantine_ratio: 0.05
    by_severity:
      critical:
        min_good_ratio: 0.999
      high:
        min_good_ratio: 0.99
      medium:
        min_good_ratio: 0.95
      low:
        min_good_ratio: 0.90

  schedule:
    environments: ["dev", "prod", "staging"]
    expected_start_utc: "06:30"
    expected_completion_utc: "07:30"
    expected_duration_minutes: 25
    warn_if_duration_exceeds_minutes: 50
    timezone: "UTC"

# ── Cost Governance ──────────────────────────────────────────────────────────
cost:
  currency: "GBP"
  budget:
    daily_limit: 15.00
    weekly_limit: 75.00
    monthly_limit: 250.00
    per_run_anomaly_multiplier: 3.0
    alert_channels: ["slack", "email"]

# ── Observatory Telemetry ────────────────────────────────────────────────────
observatory:
  enabled: true
  endpoint: "http://localhost:8001/api/v1/operations/run-logs/ingest"  # e.g., "${LAKELOGIC_OBSERVATORY_ENDPOINT}"
  api_key: "233rwejkkioasdaskasasp"   # e.g., "${LAKELOGIC_API_KEY}" for prod
  emit_on: [success, partial, failed]
  include_quarantine_sample: true     # attach first 50 quarantined rows

# ── Compliance & Privacy ─────────────────────────────────────────────────────
compliance:
  erasure:
    strategy: nullify

# Layer aliases
bronze_layer: bronze
silver_layer: silver
gold_layer: gold

