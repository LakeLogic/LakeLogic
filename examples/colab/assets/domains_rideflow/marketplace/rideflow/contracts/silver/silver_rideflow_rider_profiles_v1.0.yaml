version: 1.0.0
info:
  title: "Silver \u2014 Rideflow Rider Profiles"
  table_name: '{silver_layer}_rideflow_rider_profiles'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: marketplace
  system: rideflow

primary_key: [rider_id]
model:
  fields:
  - name: rider_id
    type: string
    required: true
  - name: name
    type: string
    pii: true
  - name: email
    type: string
    pii: true
  - name: phone
    type: string
    pii: true
  - name: date_of_birth
    type: string
    pii: true
  - name: home_address
    type: string
    pii: true
  - name: city_code
    type: string
    pii: true
  - name: signup_date
    type: timestamp
  - name: status
    type: string
  - name: preferred_payment_method
    type: string
  - name: updated_at
    type: timestamp
quality:
  row_rules: []
  dataset_rules:
  - unique: rider_id
transformations:
- deduplicate:
    by:
    - rider_id
    sort_by: [updated_at]
    order: desc
source:
  type: delta
  path: '{bronze_path}/{bronze_layer}_{system}_rider_profiles'
  load_mode: incremental
  watermark_strategy: pipeline_log
