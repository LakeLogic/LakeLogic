version: 1.0.0
info:
  title: "Silver — Rideflow Trips"
  table_name: '{silver_layer}_rideflow_trips'
  description: Cleaned, typed, and deduplicated data
  target_layer: silver
  domain: marketplace
  system: rideflow

primary_key: [trip_id]

model:
  fields:
  - name: trip_id
    type: string
    required: true
  - name: rider_id
    type: string
    required: true
  - name: driver_id
    type: string
    required: true
  - name: trip_type
    type: string
  - name: pickup_lat
    type: string
  - name: pickup_lng
    type: string
  - name: dropoff_lat
    type: string
  - name: dropoff_lng
    type: string
  - name: city_code
    type: string
  - name: requested_at
    type: timestamp
  - name: pickup_at
    type: timestamp
  - name: dropoff_at
    type: timestamp
  - name: distance_km
    type: float
  - name: duration_minutes
    type: integer
  - name: fare_amount
    type: float
  - name: surge_multiplier
    type: float
  - name: tip_amount
    type: float
  - name: payment_method
    type: string
  - name: rider_rating
    type: float
  - name: driver_rating
    type: float
  - name: notes
    type: string


quality:
  row_rules:
  - name: positive_spend
    sql: "fare_amount >= 0"
  - name: valid_rating
    sql: "rider_rating IS NULL OR (rider_rating >= 1.0 AND rider_rating <= 5.0)"

  dataset_rules:
  - unique:
    - trip_id
  fail_pipeline_on_dataset_error: true
source:
  type: delta
  path: '{bronze_path}/{bronze_layer}_{system}_trip_completed'
  load_mode: incremental
  watermark_strategy: pipeline_log

transformations:
  # Bronze retains every event as it arrived, duplicates included — a re-delivered
  # or replayed trip_completed event appears twice. Silver is where that is
  # resolved, so the uniqueness rule below has something it can actually hold.
  #
  # Without this the contract behaved correctly and halted the pipeline
  # (trip_id_unique = 59), which left silver_rideflow_trips empty and broke every
  # downstream notebook that reads it. The fix belongs here, not in the rule.
  #
  # sort_by is required, not optional: without it the surviving row is arbitrary
  # and the run is not reproducible.
  - phase: pre
    deduplicate:
      on: [trip_id]
      sort_by: [dropoff_at]
      order: desc
