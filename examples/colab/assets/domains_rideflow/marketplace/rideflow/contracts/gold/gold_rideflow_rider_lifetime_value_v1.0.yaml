version: 1.0.0

info:
  title: "Gold — Rider Lifetime Value"
  table_name: "{gold_layer}_rideflow_rider_lifetime_value"
  description: "Per-rider lifetime value analysis with trip frequency, total spend, and satisfaction."
  target_layer: gold
  domain: marketplace
  system: rideflow

source:
  type: delta
  path: "{silver_path}/silver_rideflow_trips"

model:
  fields:
    - name: rider_id
      type: string
      required: true
    - name: total_trips
      type: integer
    - name: total_spend
      type: float
    - name: total_tips
      type: float
    - name: avg_rider_rating
      type: float
    - name: first_trip
      type: timestamp
    - name: last_trip
      type: timestamp

quality:
  row_rules:
    - name: positive_spend
      sql: "total_spend >= 0"
    - name: valid_rating
      sql: "avg_rider_rating IS NULL OR (avg_rider_rating >= 1.0 AND avg_rider_rating <= 5.0)"
  dataset_rules:
    - unique: rider_id

transformations:
  - sql: |
      SELECT
          rider_id,
          COUNT(*)                   AS total_trips,
          SUM(fare_amount)           AS total_spend,
          SUM(tip_amount)            AS total_tips,
          AVG(rider_rating)          AS avg_rider_rating,
          MIN(requested_at)          AS first_trip,
          MAX(requested_at)          AS last_trip
      FROM source
      WHERE rider_id IS NOT NULL
      GROUP BY rider_id
