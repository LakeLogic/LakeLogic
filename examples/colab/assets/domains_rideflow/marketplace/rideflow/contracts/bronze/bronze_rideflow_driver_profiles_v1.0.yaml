version: 1.0.0

info:
  title: "Bronze — RideFlow Driver Profiles"
  table_name: "{bronze_layer}_{system}_driver_profiles"
  description: >
    Raw driver profile data from the RideFlow platform.
    Contains extensive driver PII including name, email, phone,
    date of birth, licence details, and bank account information.
  target_layer: bronze
  domain: marketplace
  system: rideflow

model:
  fields:
    - name: driver_id
      type: string
      required: true
      description: "Unique driver identifier"
    - name: name
      type: string
      description: "Driver full name"
      pii: true
    - name: email
      type: string
      description: "Driver email address"
      pii: true
    - name: phone
      type: string
      description: "Driver phone number"
      pii: true
    - name: date_of_birth
      type: string
      description: "Driver date of birth"
      pii: true
    - name: home_address
      type: string
      description: "Driver home address"
      pii: true
    - name: licence_number
      type: string
      description: "Driving licence number"
      pii: true
    - name: licence_plate
      type: string
      description: "Vehicle licence plate"
    - name: vehicle_type
      type: string
      description: "sedan, suv, van, motorcycle, bicycle"
    - name: bank_account_last_four
      type: string
      description: "Last 4 digits of bank account"
    - name: city_code
      type: string
      pii: true
      description: "Primary operating city"
    - name: signup_date
      type: string
      description: "Account creation date"
    - name: status
      type: string
      description: "active, inactive, suspended, pending_verification"
    - name: rating
      type: string
      description: "Current driver rating"
    - name: updated_at
      type: string
      description: "Last profile update timestamp"

source:
  type: landing
  path: "{landing_root}/driver_profiles"
  format: csv
  options:
    header: "true"
    recursiveFileLookup: "true"
  load_mode: incremental
  watermark_strategy: pipeline_log
  partition:
    format: "y_%Y/m_%m/d_%d/h_%H"
