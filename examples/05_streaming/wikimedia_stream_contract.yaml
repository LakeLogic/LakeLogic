# Wikimedia Real-Time Stream Contract

version: 1.0.0
dataset: wikimedia_recentchanges
description: "Real-time Wikipedia edits from Wikimedia Recent Changes stream"

# Source: Wikimedia SSE stream
source:
  type: stream
  connector: sse
  url: https://stream.wikimedia.org/v2/stream/recentchange
  
  streaming:
    framework: auto  # LakeLogic auto-selects (will choose Bytewax for simple transformations)
    window:
      type: tumbling
      duration: 60s

# Schema definition
model:
  fields:
    - name: id
      type: integer
      description: "Change ID"
    
    - name: type
      type: string
      description: "Event type (edit, new, log, categorize)"
    
    - name: title
      type: string
      description: "Page title"
    
    - name: user
      type: string
      description: "Username"
    
    - name: bot
      type: boolean
      description: "Is bot edit"
    
    - name: timestamp
      type: integer
      description: "Unix timestamp"
    
    - name: server_name
      type: string
      description: "Wiki server (en.wikipedia.org, etc.)"
    
    - name: namespace
      type: integer
      description: "Namespace ID (0 = article)"
    
    - name: comment
      type: string
      description: "Edit comment"

# Transformations
transformations:
  - name: wiki_language
    expression: "SPLIT(server_name, '.')[0]"
    output_column: wiki_language
    description: "Extract language code (en, de, fr, etc.)"
  
  - name: is_article_edit
    expression: "namespace == 0 AND type == 'edit'"
    output_column: is_article_edit
    description: "Is this an article edit (not talk page, user page, etc.)"
  
  - name: event_datetime
    expression: "FROM_UNIXTIME(timestamp)"
    output_column: event_datetime
    description: "Convert Unix timestamp to datetime"

# Data quality rules
quality:
  row_rules:
    - name: id_not_null
      rule: not_null
      column: id
      severity: error
      description: "Change ID must be present"
    
    - name: type_valid
      rule: in_list
      column: type
      values: ["edit", "new", "log", "categorize"]
      severity: error
      description: "Event type must be valid"
    
    - name: user_not_empty
      rule: sql
      expression: "LENGTH(user) > 0"
      severity: warning
      description: "Username should not be empty"
    
    - name: title_not_empty
      rule: sql
      expression: "LENGTH(title) > 0"
      severity: error
      description: "Page title must be present"

# BRONZE: Complete history (all events, forever)
materialization:
  bronze:
    enabled: true
    path: ./data/bronze/wikimedia_changes/
    format: delta
    mode: append  # Append all events forever
    partition_by: [date, hour]
    streaming:
      checkpoint_location: ./data/checkpoints/wikimedia_bronze/
      trigger: processingTime
      interval: 10s

# REALTIME: Materialized views (current only, for dashboards)
realtime:
  # Current activity (last 10 seconds)
  - name: current_activity
    window: tumbling_10s
    metrics:
      - name: total_edits
        expression: COUNT(*)
        description: "Total edits in last 10 seconds"
      
      - name: bot_edits
        expression: SUM(CASE WHEN bot THEN 1 ELSE 0 END)
        description: "Bot edits in last 10 seconds"
      
      - name: human_edits
        expression: SUM(CASE WHEN NOT bot THEN 1 ELSE 0 END)
        description: "Human edits in last 10 seconds"
      
      - name: article_edits
        expression: SUM(CASE WHEN is_article_edit THEN 1 ELSE 0 END)
        description: "Article edits in last 10 seconds"
    
    output:
      path: ./data/realtime/wikimedia_current_activity/
      format: delta
      mode: overwrite  # Always latest values
      retention: 1m  # Keep last 1 minute only
  
  # Edits by language (last 5 minutes)
  - name: edits_by_language_1min
    group_by: [wiki_language]
    window: tumbling_1min
    metrics:
      - name: edit_count
        expression: COUNT(*)
        description: "Total edits per language"
      
      - name: unique_users
        expression: COUNT(DISTINCT user)
        description: "Unique users per language"
      
      - name: bot_percentage
        expression: AVG(CASE WHEN bot THEN 1.0 ELSE 0.0 END) * 100
        description: "Percentage of bot edits"
    
    output:
      path: ./data/realtime/edits_by_language_1min/
      format: delta
      mode: update  # Update existing windows
      retention: 5m  # Keep last 5 minutes
  
  # Top edited pages (last 10 minutes)
  - name: top_pages_1min
    group_by: [title, wiki_language]
    window: tumbling_1min
    metrics:
      - name: edit_count
        expression: COUNT(*)
        description: "Number of edits to this page"
      
      - name: unique_editors
        expression: COUNT(DISTINCT user)
        description: "Number of unique editors"
    
    output:
      path: ./data/realtime/top_pages_1min/
      format: delta
      mode: update
      retention: 10m  # Keep last 10 minutes

# Lineage tracking
lineage:
  inject_source_path: true
  inject_run_id: true
  inject_processing_timestamp: true
  source_system: "Wikimedia Recent Changes Stream"
  data_domain: "Wikipedia"
  tags:
    - streaming
    - wikipedia
    - real-time
