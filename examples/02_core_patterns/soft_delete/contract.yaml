version: 1.0.0
dataset: users_silver

author: LakeLogic

description: "Soft delete pattern with standardized metadata columns"

source:
  type: table
  cdc_op_field: "op"
  cdc_delete_values: ["D"]

primary_key: ["user_id"]

materialization:
  strategy: merge
  path: "./data/users_silver/"
  format: parquet
  soft_delete_column: "_lakelogic_is_deleted"
  soft_delete_value: true
  soft_delete_time_column: "_lakelogic_deleted_at"
  soft_delete_reason_column: "_lakelogic_delete_reason"
