version: 1.0.0
info:
  title: Reference States (Silver)
  version: 1.0.0
  description: ISO state codes reference.
  owner: Shared Reference Data
  status: active
  classification: Public
metadata:
  run_log_path: ../../../../output/run_logs/ref_states.json
  run_log_table: lakeguard.run_logs
  run_log_backend: duckdb
  run_log_database: ../../../../output/run_logs/lakeguard_run_logs.duckdb
server:
  type: local
  path: ../../../../data/reference/states.csv
  format: csv
environments:
  dev:
    path: ../../../../data/reference/states.csv
    format: csv
dataset: silver_reference_states
primary_key:
- state_code
model:
  fields:
  - name: state_code
    type: string
    required: true
  - name: state_name
    type: string
  - name: region
    type: string
quality:
  row_rules:
  - not_null: state_code
  dataset_rules:
  - unique: state_code
lineage:
  enabled: true
materialization:
  strategy: overwrite
  target_path: ../../../../output/silver/reference_states
  format: parquet
quarantine:
  enabled: true
  include_error_reason: true
  target: ../../../../output/quarantine/reference_states
source:
  type: landing
  path: ../../../../data/reference
  load_mode: full
  pattern: states*.csv
