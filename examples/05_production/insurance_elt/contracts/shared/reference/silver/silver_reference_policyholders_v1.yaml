version: 1.0.0
info:
  title: Reference Policyholders (Silver)
  version: 1.0.0
  description: Policyholder master reference data.
  owner: Shared Reference Data
  status: active
  classification: PII
metadata:
  run_log_path: ../../../../output/run_logs/ref_policyholders.json
  run_log_table: lakeguard.run_logs
  run_log_backend: duckdb
  run_log_database: ../../../../output/run_logs/lakeguard_run_logs.duckdb
server:
  type: local
  path: ../../../../data/reference/policyholders.csv
  format: csv
environments:
  dev:
    path: ../../../../data/reference/policyholders.csv
    format: csv
dataset: silver_reference_policyholders
primary_key:
- customer_id
model:
  fields:
  - name: customer_id
    type: integer
    required: true
  - name: first_name
    type: string
  - name: last_name
    type: string
  - name: state_code
    type: string
  - name: email
    type: string
  - name: phone
    type: string
  - name: date_of_birth
    type: date
quality:
  row_rules:
  - not_null: customer_id
  dataset_rules:
  - unique: customer_id
lineage:
  enabled: true
materialization:
  strategy: overwrite
  target_path: ../../../../output/silver/reference_policyholders
  format: parquet
quarantine:
  enabled: true
  include_error_reason: true
  target: ../../../../output/quarantine/reference_policyholders
source:
  type: landing
  path: ../../../../data/reference
  load_mode: full
  pattern: policyholders*.csv
