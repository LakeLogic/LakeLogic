version: 1.0.0
info:
  title: Billing Payments CDC (Bronze)
  version: 1.0.0
  description: CDC feed from Billing system.
  owner: Billing Data Team
  status: active
  classification: Financial
metadata:
  run_log_path: ../../../../output/run_logs/payments_bronze.json
  run_log_table: lakelogic.run_logs
  run_log_backend: duckdb
  run_log_database: ../../../../output/run_logs/lakelogic_run_logs.duckdb
server:
  type: local
  path: ../../../../data/bronze/payments_cdc.csv
  format: csv
  mode: ingest
  schema_evolution: strict
  allow_schema_drift: false
environments:
  dev:
    path: ../../../../data/bronze/payments_cdc.csv
    format: csv
dataset: bronze_payments
primary_key:
- payment_id
schema_policy:
  evolution: strict
  unknown_fields: quarantine
model:
  fields:
  - name: payment_id
    type: string
    required: true
  - name: policy_id
    type: string
  - name: customer_id
    type: integer
  - name: payment_date
    type: date
  - name: payment_amount
    type: double
  - name: payment_method
    type: string
  - name: updated_at
    type: timestamp
  - name: op
    type: string
transformations:
- filter:
    sql: op <> 'D'
  phase: pre
- deduplicate:
    on:
    - payment_id
    sort_by:
    - updated_at
    order: desc
  phase: pre
quality:
  row_rules:
  - not_null: payment_id
  - accepted_values:
      field: op
      values:
      - I
      - U
      - D
  - accepted_values:
      field: payment_method
      values:
      - CARD
      - ACH
      - CHECK
  dataset_rules:
  - unique: payment_id
lineage:
  enabled: true
materialization:
  strategy: append
  target_path: ../../../../output/bronze/payments
  format: parquet
quarantine:
  enabled: true
  strict_notifications: false
  include_error_reason: true
  target: ../../../../output/quarantine/payments
  notifications:
  - type: webhook
    target: env:LAKELOGIC_ALERT_WEBHOOK
    on_events:
    - quarantine
    - failure
source:
  type: landing
  path: ../../../../data/bronze
  load_mode: cdc
  pattern: payments_cdc*.csv
  watermark_field: updated_at
  cdc_op_field: op
  cdc_delete_values:
  - D
