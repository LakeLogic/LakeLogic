version: 1.0.0
dataset: parquet_customers
description: Parquet ingestion example
source:
  type: file
  path: ./data/sample.parquet
  format: parquet
model:
  fields:
  - name: id
    type: integer
  - name: email
    type: string
quality:
  row_rules:
  - not_null:
      field: email
      name: email_not_null
      severity: warning
