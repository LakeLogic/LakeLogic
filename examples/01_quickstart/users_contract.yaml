version: 1.0.0
dataset: local_users
description: "User data extraction from local SQLite"

source:
  type: database
  connector: sqlite
  connection:
    database: example.db
  query: "SELECT * FROM users"

model:
  fields:
    - name: id
      type: integer
    - name: name
      type: string
    - name: email
      type: string

quality:
  row_rules:
    - name: Valid Email
      sql: "email LIKE '%@%'"
      category: correctness
    - name: Valid ID
      sql: "id > 0"
      category: correctness

materialization:
  bronze:
    enabled: true
    path: ./data/bronze/users/
    format: delta
    mode: overwrite
