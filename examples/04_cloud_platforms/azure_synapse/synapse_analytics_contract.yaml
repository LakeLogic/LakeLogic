version: 1.0.0
dataset: synapse_orders
description: "Azure Synapse validation example"

source:
  type: delta
  path: "abfss://datalake@storageaccount.dfs.core.windows.net/silver/orders"

model:
  fields:
    - name: order_id
      type: integer
    - name: customer_id
      type: integer
    - name: order_date
      type: date
    - name: total_amount
      type: decimal

quality:
  row_rules:
    - name: order_id_not_null
      rule: not_null
      column: order_id
      severity: error

materialization:
  good:
    enabled: true
    path: abfss://datalake@storageaccount.dfs.core.windows.net/validated/orders
    format: delta
    mode: append
