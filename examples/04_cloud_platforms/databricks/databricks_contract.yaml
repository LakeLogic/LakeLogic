version: 1.0.0
dataset: unity_catalog_sales
description: "Sales transactions from Databricks Unity Catalog"

source:
  type: database
  connector: databricks
  connection:
    host: "${env:DATABRICKS_HOST}"
    http_path: "${env:DATABRICKS_HTTP_PATH}"
    access_token: "${env:DATABRICKS_TOKEN}"
  query: "SELECT * FROM main.silver.sales_transactions LIMIT 100"

quality:
  row_rules:
    - name: valid_transaction_id
      rule: not_null
      column: transaction_id
      severity: error

materialization:
  bronze:
    enabled: true
    path: "./data/bronze/unity_sales/"
    format: delta
    mode: overwrite
