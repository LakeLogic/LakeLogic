# ══════════════════════════════════════════════════════════════════════════════
# CRM Domain / Webshop System — Registry
#
#   contracts/
#   └── crm/                     ← domain (business unit)
#       └── webshop/             ← system (source system)
#           ├── _system.yaml     ← THIS FILE (system-level config)
#           ├── bronze/          ← layer contracts
#           ├── silver/
#           └── gold/
#
# System-level config applies to ALL contracts in this system.
# Individual contracts can override any setting (e.g. target_path, strategy).
#
# Engine-portable: develop locally with DuckDB or Polars, deploy the same
# contracts unchanged on Databricks / Spark for production scale.
# ══════════════════════════════════════════════════════════════════════════════

domain: crm
system: webshop

storage:
  external_location_root: "lakehouse/{domain}"

variables:
  bronze_layer: bronze
  silver_layer: silver
  gold_layer: gold

external_sources:
  - name: "webshop API"
    source_domain: "webshop"
    consumed_by: ["orders", "customers"]

# ── Contract Registry ─────────────────────────────────────────────────────
# Paths relative to this _system.yaml location.
contracts:
  # Bronze
  - layer: bronze
    entity: customers
    path: "bronze/bronze_customers_v1.0.yaml"
    enabled: true

  - layer: bronze
    entity: orders
    path: "bronze/bronze_orders_v1.0.yaml"
    enabled: true

  # Silver
  - layer: silver
    entity: customers_cleansed
    path: "silver/silver_customers_v1.0.yaml"
    enabled: true

  - layer: silver
    entity: orders_enriched
    path: "silver/silver_orders_enriched_v1.0.yaml"
    depends_on: [customers_cleansed]
    enabled: true

  # Gold
  - layer: gold
    entity: dim_customers
    path: "gold/gold_dim_customers_v1.0.yaml"
    enabled: true

  - layer: gold
    entity: daily_revenue
    path: "gold/gold_daily_revenue_v1.0.yaml"
    depends_on: [dim_customers]
    enabled: true

# ── System-Level Defaults ─────────────────────────────────────────────────
# Contracts inherit these; override at contract level when needed.
lineage:
  enabled: true
  timestamp_column_name: "_lakelogic_processed_at"
  run_id_column_name: "_lakelogic_run_id"

server:
  bronze:
    schema_evolution: append
    allow_schema_drift: true
  silver:
    schema_evolution: strict
  gold:
    schema_evolution: strict

quarantine:
  enabled: true
  include_error_reason: true

materialization:
  bronze:
    strategy: append
    format: delta
  silver:
    strategy: merge
    format: delta
  gold:
    strategy: merge
    format: delta

environments:
  dev:
    catalog: local
    path: "lakehouse/dev"
  staging:
    catalog: local
    path: "lakehouse/staging"
  prod:
    catalog: local
    path: "lakehouse/prod"


metadata:
  run_log_table: "{external_location_root}/_run_logs"
  run_log_backend: "delta"