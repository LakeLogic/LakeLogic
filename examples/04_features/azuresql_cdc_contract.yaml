# Azure SQL CDC Contract Example
# This contract demonstrates CDC (Change Data Capture) from Azure SQL Database

version: 1.0.0
dataset: bronze_orders
description: "Bronze layer orders from Azure SQL Database (CDC with automatic Azure AD auth)"

# Azure SQL Database source (automatic Azure AD authentication)
source:
  type: database
  connector: azuresql
  server: myserver.database.windows.net
  database: production_db
  table: dbo.orders
  
  # CDC configuration (incremental extraction)
  cdc:
    enabled: true
    watermark_column: updated_at
    watermark_type: timestamp
    # Last watermark is stored automatically in metadata

# Schema definition
model:
  fields:
    - name: order_id
      type: integer
      description: "Unique order identifier"
    
    - name: customer_id
      type: integer
      description: "Customer identifier"
    
    - name: order_date
      type: date
      description: "Order placement date"
    
    - name: total_amount
      type: decimal
      description: "Total order amount"
    
    - name: status
      type: string
      description: "Order status (pending, confirmed, shipped, delivered, cancelled)"
    
    - name: payment_method
      type: string
      description: "Payment method (credit_card, debit_card, paypal, bank_transfer)"
    
    - name: shipping_address
      type: string
      description: "Shipping address"
    
    - name: created_at
      type: timestamp
      description: "Record creation timestamp"
    
    - name: updated_at
      type: timestamp
      description: "Record last update timestamp (CDC watermark)"

# Transformations
transformations:
  - name: extract_country
    expression: "SPLIT(shipping_address, ',')[-1].strip()"
    output_column: country
  
  - name: order_age_days
    expression: "(CURRENT_DATE - order_date).days"
    output_column: order_age_days
  
  - name: is_recent_order
    expression: "order_age_days <= 30"
    output_column: is_recent_order

# Quality rules
quality:
  # Row-level rules
  row_rules:
    - name: order_id_not_null
      rule: not_null
      column: order_id
      severity: error
    
    - name: customer_id_not_null
      rule: not_null
      column: customer_id
      severity: error
    
    - name: total_amount_positive
      rule: sql
      expression: "total_amount > 0"
      severity: error
    
    - name: status_valid
      rule: in_list
      column: status
      values: ["pending", "confirmed", "shipped", "delivered", "cancelled"]
      severity: error
    
    - name: payment_method_valid
      rule: in_list
      column: payment_method
      values: ["credit_card", "debit_card", "paypal", "bank_transfer"]
      severity: error
    
    - name: order_date_not_future
      rule: sql
      expression: "order_date <= CURRENT_DATE"
      severity: error
    
    - name: updated_at_after_created_at
      rule: sql
      expression: "updated_at >= created_at"
      severity: warning
  
  # Dataset-level rules
  dataset_rules:
    - name: no_duplicate_orders
      rule: unique
      columns: [order_id]
      severity: error
    
    - name: min_records_check
      rule: row_count
      min_count: 1
      severity: warning

# Materialization (write to Delta Lake)
materialization:
  good:
    enabled: true
    path: s3://datalake/bronze/orders/  # Or Unity Catalog: main.bronze.orders
    format: delta
    mode: append
    partition_by: [order_date]
  
  quarantine:
    enabled: true
    path: s3://datalake/quarantine/orders/  # Or Unity Catalog: main.quarantine.orders
    format: delta
    mode: append

# Lineage tracking
lineage:
  inject_source_path: true
  inject_run_id: true
  inject_processing_timestamp: true
  source_system: "Azure SQL - Production DB"
  data_domain: "Sales"

# Notifications
notifications:
  on_quarantine:
    enabled: true
    threshold: 0.05  # Alert if >5% of records are quarantined
  
  on_failure:
    enabled: true

# Metadata
metadata:
  owner: "Data Engineering Team"
  contact: "data-eng@company.com"
  sla_hours: 24
  retention_days: 90
