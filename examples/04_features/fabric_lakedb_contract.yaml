# Fabric LakeDB Contract Example
# This contract demonstrates using Microsoft Fabric table names with Delta Lake

version: 1.0.0
dataset: bronze_sales
description: "Bronze layer sales data from Fabric LakeDB (Spark-free with Delta-RS)"

# Fabric LakeDB table name (workspace.lakehouse.table)
# LakeLogic automatically resolves this to the OneLake storage path
server:
  type: delta
  path: myworkspace.sales_lakehouse.transactions  # Fabric table name
  format: delta

# Schema definition
model:
  fields:
    - name: transaction_id
      type: string
      description: "Unique transaction identifier"
    
    - name: customer_id
      type: integer
      description: "Customer identifier"
    
    - name: product_id
      type: string
      description: "Product SKU"
    
    - name: quantity
      type: integer
      description: "Quantity purchased"
    
    - name: unit_price
      type: decimal
      description: "Price per unit"
    
    - name: total_amount
      type: decimal
      description: "Total transaction amount"
    
    - name: transaction_date
      type: date
      description: "Transaction date"
    
    - name: payment_method
      type: string
      description: "Payment method (credit_card, debit_card, paypal, cash)"

# Transformations (calculate total_amount if missing)
transformations:
  - name: calculate_total
    expression: "quantity * unit_price"
    output_column: total_amount_calculated
  
  - name: coalesce_total
    expression: "COALESCE(total_amount, total_amount_calculated)"
    output_column: total_amount

# Quality rules
quality:
  row_rules:
    - name: transaction_id_not_null
      rule: not_null
      column: transaction_id
      severity: error
    
    - name: quantity_positive
      rule: sql
      expression: "quantity > 0"
      severity: error
    
    - name: unit_price_positive
      rule: sql
      expression: "unit_price > 0"
      severity: error
    
    - name: total_amount_matches
      rule: sql
      expression: "ABS(total_amount - (quantity * unit_price)) < 0.01"
      severity: warning
    
    - name: payment_method_valid
      rule: in_list
      column: payment_method
      values: ["credit_card", "debit_card", "paypal", "cash"]
      severity: error
  
  dataset_rules:
    - name: no_duplicate_transactions
      rule: unique
      columns: [transaction_id]
      severity: error

# Materialization (write to Fabric LakeDB)
materialization:
  good:
    enabled: true
    path: myworkspace.sales_lakehouse.transactions_validated  # Fabric table name
    format: delta
    mode: append
  
  quarantine:
    enabled: true
    path: myworkspace.sales_lakehouse.transactions_quarantine  # Fabric table name
    format: delta
    mode: append

# Lineage tracking
lineage:
  inject_source_path: true
  inject_run_id: true
  inject_processing_timestamp: true
