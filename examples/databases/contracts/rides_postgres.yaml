# Rides from PostgreSQL (here Azure Database for PostgreSQL). The connection string, password
# included, is an environment variable: the contract names it, never holds it.
version: 1.0.0
dataset: rides
info: {title: bronze_rides_postgres}
primary_key: [ride_id]
source:
  type: database
  path: env:POSTGRES_URI                # postgresql://user:password@host:5432/db?sslmode=require — kept out of the contract
  load_mode: incremental           # full — every row, every run | incremental — rows newer than the last run's watermark_field
                                      # | cdc — the database's change log (inserts, updates, deletes)
  watermark_field: updated_at          # incremental: a timestamp/number column that grows when a row changes
model:
  fields:
    - {name: ride_id, type: long, required: true}
    - {name: city, type: string, required: true}
    - {name: fare, type: double, required: true}
    - {name: status, type: string}
    - {name: updated_at, type: timestamp}
quality:
  row_rules:
    - {name: fare_not_negative, sql: "fare >= 0"}
materialization:
  strategy: merge                     # append | overwrite | merge (upsert on primary_key) | scd2
  format: delta
  target_path: data/bronze/rides_postgres
quarantine:
  target: data/quarantine/rides_postgres
  format: delta
metadata:
  # The run log remembers the incremental watermark between runs.
  run_log_table: run_log
  run_log_backend: duckdb
  run_log_database: data/run_log_postgres.duckdb   # one per contract: the watermark is per source
