version: "1.0.0"
upstream: ["02_cust_silver"]

info:
  title: "Customer Dimension (Gold)"
  version: 1.0.0
  description: "SCD Type 2 Customer dimension table."
  target_layer: "gold"

server:
  type: "local"
  format: "parquet"
  path: "data/silver_customers.parquet"

primary_key: ["customer_id"]

materialization:
  strategy: "scd2"
  format: "parquet"
  target_path: "data/gold_customers_scd2.parquet"
  scd2:
    effective_from_field: "valid_from"
    effective_to_field: "valid_to"
    current_flag_field: "is_current"
