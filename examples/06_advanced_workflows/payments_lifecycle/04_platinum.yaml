version: "1.0.0"
upstream: ["03_gold"]

info:
  title: "Monthly Ledger (Platinum)"
  version: 1.0.0
  description: "Frozen monthly snapshot for compliance."
  target_layer: "platinum"

server:
  type: "local"
  format: "iceberg"
  path: "data/gold_transactions"

quality:
  dataset_rules:
    - name: "total_sum_stability"
      sql: "SUM(amount_usd) > 0"
    - name: "integrity_check"
      sql: "COUNT(*) = COUNT(raw_id)"

materialization:
  strategy: "overwrite"
  format: "delta"
  target_path: "data/platinum_ledger_feb"

quarantine:
  enabled: true
