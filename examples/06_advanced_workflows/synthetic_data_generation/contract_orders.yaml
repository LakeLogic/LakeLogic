version: "1.0.0"
info:
  title: "Orders (Silver)"
  version: "1.0.0"
  description: "Contract for the silver orders dataset. Used to demonstrate DataGenerator."
  target_layer: "silver"

server:
  type: "local"
  format: "parquet"
  path: "data/orders_sample.parquet"

model:
  fields:
    - name: "order_id"
      type: "string"
      required: true
    - name: "customer_email"
      type: "string"
      required: true
    - name: "customer_name"
      type: "string"
    - name: "status"
      type: "string"
      required: true
    - name: "amount"
      type: "double"
      required: true
    - name: "tax_rate"
      type: "double"
    - name: "quantity"
      type: "integer"
    - name: "order_date"
      type: "date"
    - name: "region"
      type: "string"
    - name: "is_b2b"
      type: "boolean"

quality:
  row_rules:
    - name: "valid_status"
      sql: "status IN ('pending', 'confirmed', 'shipped', 'delivered', 'cancelled')"
      accepted_values:
        field: "status"
        values: ["pending", "confirmed", "shipped", "delivered", "cancelled"]
    - name: "valid_region"
      sql: "region IN ('EMEA', 'APAC', 'AMER', 'LATAM')"
      accepted_values:
        field: "region"
        values: ["EMEA", "APAC", "AMER", "LATAM"]
    - name: "amount_positive"
      sql: "amount > 0"
      range:
        field: "amount"
        min: 0.01
        max: 50000.0
    - name: "valid_tax_rate"
      sql: "tax_rate BETWEEN 0 AND 1"
      range:
        field: "tax_rate"
        min: 0.0
        max: 1.0
    - name: "quantity_positive"
      sql: "quantity > 0"
      range:
        field: "quantity"
        min: 1
        max: 500
    - name: "order_id_not_null"
      sql: "order_id IS NOT NULL"
    - name: "email_not_null"
      sql: "customer_email IS NOT NULL"

materialization:
  strategy: "append"
  format: "parquet"
  target_path: "data/orders_sample.parquet"
