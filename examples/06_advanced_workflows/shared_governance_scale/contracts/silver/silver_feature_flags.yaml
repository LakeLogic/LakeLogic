version: 1.0.0
metadata:
  owner: data-platform@company.com
  policy_pack: shared_standard
  domain: growth
  system: app_events
schema_policy:
  evolution: strict
  unknown_fields: quarantine
quality:
  enforce_required: !!bool 'true'
  dataset_rules:
  - row_count_between:
      min: 1
      max: 1000000000
lineage:
  enabled: !!bool 'true'
  capture_domain: !!bool 'true'
  capture_system: !!bool 'true'
materialization:
  strategy: append
  format: parquet
  target_path: ../../output/silver/feature_flags
info:
  title: Silver Feature Flags
  version: 1.0.0
  target_layer: silver
dataset: silver_feature_flags
source:
  type: landing
  path: ../../data/feature_flags.csv
  load_mode: full
model:
  fields:
  - name: user_id
    type: string
    required: !!bool 'true'
  - name: flag_new_checkout
    type: boolean
  - name: flag_beta_home
    type: boolean
  - name: flag_new_nav
    type: boolean
transformations:
- pivot:
    id_vars:
    - user_id
    pivot_col: flag_name
    value_cols:
    - enabled
    values:
    - new_checkout
    - beta_home
    - new_nav
    agg: max
    name_template: flag_{pivot_alias}
    fill_value: !!bool 'false'
  phase: post
