version: 1.0.0
info:
  title: Silver Logins
  target_layer: silver
dataset: silver_logins
source:
  type: landing
  path: ../../data/logins.csv
  load_mode: full
metadata:
  domain: growth
  system: app_events
model:
  fields:
  - name: login_id
    type: string
    required: true
  - name: user_id
    type: string
    required: true
  - name: login_ts
    type: timestamp
  - name: ip_address
    type: string
materialization:
  target_path: ../../output/silver/logins
  format: parquet
  strategy: append
