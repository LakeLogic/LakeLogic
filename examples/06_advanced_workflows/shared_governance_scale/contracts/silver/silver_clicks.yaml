version: 1.0.0
info:
  title: Silver Clicks
  target_layer: silver
dataset: silver_clicks
source:
  type: landing
  path: ../../data/clicks.csv
  load_mode: full
metadata:
  domain: growth
  system: app_events
model:
  fields:
  - name: click_id
    type: string
    required: true
  - name: user_id
    type: string
    required: true
  - name: campaign
    type: string
  - name: click_ts
    type: timestamp
  - name: operation
    type: string
  - name: deleted_at
    type: timestamp
  - name: is_deleted
    type: boolean
materialization:
  target_path: ../../output/silver/clicks
  format: parquet
  strategy: append
