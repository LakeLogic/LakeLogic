version: 1.0.0
info:
  title: Silver Sessions
  target_layer: silver
dataset: silver_sessions
source:
  type: landing
  path: ../../data/sessions.csv
  load_mode: full
metadata:
  domain: growth
  system: app_events
model:
  fields:
  - name: session_id
    type: string
    required: true
  - name: user_id
    type: string
    required: true
  - name: device_type
    type: string
  - name: started_at
    type: timestamp
materialization:
  target_path: ../../output/silver/sessions
  format: parquet
  strategy: append
transformations:
- deduplicate:
    'on':
    - session_id
    sort_by:
    - started_at
    order: desc
  phase: pre
