version: 1.0.0
info:
  title: Silver Events
  target_layer: silver
dataset: silver_events
source:
  type: landing
  path: ../../data/events.csv
  load_mode: full
metadata:
  domain: growth
  system: app_events
model:
  fields:
  - name: event_id
    type: string
    required: true
  - name: user_id
    type: string
    required: true
  - name: event_type
    type: string
  - name: amount
    type: double
  - name: event_ts
    type: timestamp
  - name: operation
    type: string
  - name: deleted_at
    type: timestamp
  - name: is_deleted
    type: boolean
materialization:
  target_path: ../../output/silver/events
  format: parquet
  strategy: append
transformations:
- filter:
    sql: amount IS NULL OR amount >= 0
  phase: pre
