version: 1.0.0
info:
  title: Silver Users
  target_layer: silver
dataset: silver_users
source:
  type: landing
  path: ../../data/users.csv
  load_mode: full
metadata:
  domain: growth
  system: app_events
model:
  fields:
  - name: user_id
    type: string
    required: true
  - name: email
    type: string
  - name: status
    type: string
  - name: updated_at
    type: timestamp
materialization:
  target_path: ../../output/silver/users
  format: parquet
  strategy: append
transformations:
- deduplicate:
    'on':
    - user_id
    sort_by:
    - updated_at
    order: desc
  phase: pre
