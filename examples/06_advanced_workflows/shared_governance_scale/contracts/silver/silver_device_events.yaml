version: 1.0.0
info:
  title: Silver Device Events
  target_layer: silver
dataset: silver_device_events
source:
  type: landing
  path: ../../data/device_events.csv
  load_mode: full
metadata:
  domain: growth
  system: app_events
model:
  fields:
  - name: device_event_id
    type: string
    required: true
  - name: user_id
    type: string
    required: true
  - name: device_id
    type: string
  - name: event_ts
    type: timestamp
materialization:
  target_path: ../../output/silver/device_events
  format: parquet
  strategy: append
