version: 1.0.0
metadata:
  owner: data-platform@company.com
  policy_pack: shared_standard
  domain: growth
  system: app_events
schema_policy:
  evolution: strict
  unknown_fields: quarantine
quality:
  enforce_required: !!bool 'true'
  dataset_rules:
  - row_count_between:
      min: 1
      max: 1000000000
lineage:
  enabled: !!bool 'true'
  capture_domain: !!bool 'true'
  capture_system: !!bool 'true'
materialization:
  strategy: append
  format: parquet
  target_path: ../../output/silver/refunds
info:
  title: Silver Refunds
  version: 1.0.0
  target_layer: silver
dataset: silver_refunds
source:
  type: landing
  path: ../../data/refunds.csv
  load_mode: full
model:
  fields:
  - name: refund_id
    type: string
    required: !!bool 'true'
  - name: user_id
    type: string
    required: !!bool 'true'
  - name: amount
    type: double
  - name: refund_ts
    type: timestamp
transformations:
- filter:
    sql: amount IS NULL OR amount >= 0
  phase: pre
