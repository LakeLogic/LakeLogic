version: 1.0.0
info:
  title: Silver Refunds
  target_layer: silver
dataset: silver_refunds
source:
  type: landing
  path: ../../data/refunds.csv
  load_mode: full
metadata:
  domain: growth
  system: app_events
model:
  fields:
  - name: refund_id
    type: string
    required: true
  - name: user_id
    type: string
    required: true
  - name: amount
    type: double
  - name: refund_ts
    type: timestamp
materialization:
  target_path: ../../output/silver/refunds
  format: parquet
  strategy: append
transformations:
- filter:
    sql: amount IS NULL OR amount >= 0
  phase: pre
