version: "1.0.0"
upstream: ["01_bronze_payments"]

info:
  title: "Standardized Payments (Silver)"
  description: "Cleaned and normalized payment records."
  target_layer: "silver"

server:
  type: "local"
  format: "parquet"
  path: "data/bronze_payments.parquet"

transformations:
  - derive:
      field: "amount_usd"
      sql: "CAST(amount_str AS DOUBLE)"
  - derive:
      field: "processed_at"
      sql: "CAST(event_ts AS TIMESTAMP)"
  - deduplicate:
      on: ["raw_id"]
      sort_by: ["processed_at"]
      order: "desc"

quality:
  row_rules:
    - name: "positive_amount"
      sql: "amount_usd >= 0"

materialization:
  strategy: "overwrite"
  format: "parquet"
  target_path: "data/silver_payments.parquet"
