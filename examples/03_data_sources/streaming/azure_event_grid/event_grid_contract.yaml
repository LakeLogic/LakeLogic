version: 1.0.0
dataset: azure_storage_events
source:
  type: stream
  connector: azure_event_grid
  config:
    endpoint: ${AZURE_EVENT_GRID_ENDPOINT}
    subscription_name: storage-events-subscription
    max_events: 10
    wait_time_seconds: 60
schema:
  fields:
  - name: id
    type: string
    required: true
  - name: eventType
    type: string
    required: true
  - name: subject
    type: string
    required: true
  - name: eventTime
    type: timestamp
    required: true
  - name: data
    type: object
    required: true
quality:
  rules:
  - name: valid_event_type
    type: allowed_values
    column: eventType
    allowed:
    - Microsoft.Storage.BlobCreated
    - Microsoft.Storage.BlobDeleted
    - Microsoft.Storage.BlobRenamed
    severity: error
  - name: recent_event
    type: custom
    expression: pl.col('eventTime') > pl.datetime(2024, 1, 1)
    severity: warning
materialization:
  strategy: append
  path: ./data/bronze/azure_events/
  format: delta
  partition_by:
  - eventType
