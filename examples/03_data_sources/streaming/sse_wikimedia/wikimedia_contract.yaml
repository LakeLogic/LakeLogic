version: 1.0.0
dataset: wikimedia_recent_changes
description: "Real-time Wikimedia edit stream"

source:
  type: streaming
  connector: sse
  url: "https://stream.wikimedia.org/v2/stream/recentchange"

model:
  fields:
    - name: id
      type: long
    - name: type
      type: string
    - name: title
      type: string
    - name: user
      type: string
    - name: bot
      type: boolean
    - name: timestamp
      type: long

quality:
  row_rules:
    - name: title_not_null
      rule: not_null
      column: title
      severity: error

materialization:
  bronze:
    enabled: true
    path: "./data/bronze/wikimedia/"
    format: delta
    mode: append
