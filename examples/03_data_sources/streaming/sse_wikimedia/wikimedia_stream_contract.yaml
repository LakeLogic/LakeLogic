version: 1.0.0
dataset: wikimedia_recentchanges
description: Real-time Wikipedia edits from Wikimedia Recent Changes stream
source:
  type: stream
  connector: sse
  url: https://stream.wikimedia.org/v2/stream/recentchange
  streaming:
    framework: auto
    window:
      type: tumbling
      duration: 60s
model:
  fields:
  - name: id
    type: integer
    description: Change ID
  - name: type
    type: string
    description: Event type (edit, new, log, categorize)
  - name: title
    type: string
    description: Page title
  - name: user
    type: string
    description: Username
  - name: bot
    type: boolean
    description: Is bot edit
  - name: timestamp
    type: integer
    description: Unix timestamp
  - name: server_name
    type: string
    description: Wiki server (en.wikipedia.org, etc.)
  - name: namespace
    type: integer
    description: Namespace ID (0 = article)
  - name: comment
    type: string
    description: Edit comment
transformations:
- name: wiki_language
  expression: SPLIT(server_name, '.')[0]
  output_column: wiki_language
  description: Extract language code (en, de, fr, etc.)
- name: is_article_edit
  expression: namespace == 0 AND type == 'edit'
  output_column: is_article_edit
  description: Is this an article edit (not talk page, user page, etc.)
- name: event_datetime
  expression: FROM_UNIXTIME(timestamp)
  output_column: event_datetime
  description: Convert Unix timestamp to datetime
quality:
  row_rules:
  - not_null:
      field: id
      name: id_not_null
      severity: error
  - accepted_values:
      field: type
      values:
      - edit
      - new
      - log
      - categorize
      name: type_valid
      severity: error
  - name: user_not_empty
    sql: LENGTH(user) > 0
    category: correctness
    severity: warning
  - name: title_not_empty
    sql: LENGTH(title) > 0
    category: correctness
    severity: error
materialization:
  bronze:
    enabled: true
    path: ./data/bronze/wikimedia_changes/
    format: delta
    mode: append
    partition_by:
    - date
    - hour
    streaming:
      checkpoint_location: ./data/checkpoints/wikimedia_bronze/
      trigger: processingTime
      interval: 10s
realtime:
- name: current_activity
  window: tumbling_10s
  metrics:
  - name: total_edits
    expression: COUNT(*)
    description: Total edits in last 10 seconds
  - name: bot_edits
    expression: SUM(CASE WHEN bot THEN 1 ELSE 0 END)
    description: Bot edits in last 10 seconds
  - name: human_edits
    expression: SUM(CASE WHEN NOT bot THEN 1 ELSE 0 END)
    description: Human edits in last 10 seconds
  - name: article_edits
    expression: SUM(CASE WHEN is_article_edit THEN 1 ELSE 0 END)
    description: Article edits in last 10 seconds
  output:
    path: ./data/realtime/wikimedia_current_activity/
    format: delta
    mode: overwrite
    retention: 1m
- name: edits_by_language_1min
  group_by:
  - wiki_language
  window: tumbling_1min
  metrics:
  - name: edit_count
    expression: COUNT(*)
    description: Total edits per language
  - name: unique_users
    expression: COUNT(DISTINCT user)
    description: Unique users per language
  - name: bot_percentage
    expression: AVG(CASE WHEN bot THEN 1.0 ELSE 0.0 END) * 100
    description: Percentage of bot edits
  output:
    path: ./data/realtime/edits_by_language_1min/
    format: delta
    mode: update
    retention: 5m
- name: top_pages_1min
  group_by:
  - title
  - wiki_language
  window: tumbling_1min
  metrics:
  - name: edit_count
    expression: COUNT(*)
    description: Number of edits to this page
  - name: unique_editors
    expression: COUNT(DISTINCT user)
    description: Number of unique editors
  output:
    path: ./data/realtime/top_pages_1min/
    format: delta
    mode: update
    retention: 10m
lineage:
  inject_source_path: true
  inject_run_id: true
  inject_processing_timestamp: true
  source_system: Wikimedia Recent Changes Stream
  data_domain: Wikipedia
  tags:
  - streaming
  - wikipedia
  - real-time
