version: 1.0.0
dataset: aws_order_events
source:
  type: stream
  connector: aws_sqs
  config:
    queue_url: ${AWS_SQS_QUEUE_URL}
    region: us-east-1
    max_messages: 10
    wait_time_seconds: 20
schema:
  fields:
  - name: orderId
    type: string
    required: true
  - name: customerId
    type: string
    required: true
  - name: amount
    type: float
    required: true
  - name: currency
    type: string
    required: true
  - name: timestamp
    type: timestamp
    required: true
  - name: status
    type: string
    required: true
quality:
  rules:
  - name: valid_amount
    type: range
    column: amount
    min: 0.01
    max: 1000000
    severity: error
  - name: valid_currency
    type: allowed_values
    column: currency
    allowed:
    - USD
    - EUR
    - GBP
    severity: error
  - name: valid_status
    type: allowed_values
    column: status
    allowed:
    - pending
    - completed
    - failed
    - refunded
    severity: warning
materialization:
  strategy: append
  path: ./data/bronze/aws_orders/
  format: delta
  partition_by:
  - status
