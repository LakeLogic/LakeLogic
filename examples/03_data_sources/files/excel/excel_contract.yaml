version: "1.0.0"
dataset: employees_excel

info:
  title: Excel Employee Data Validation
  description: |
    Example contract demonstrating Excel (.xlsx) ingestion with LakeLogic.
    This ingests employee data from Excel files with the same validation
    as the XML example.
  
source:
  type: landing
  path: data/employees.xlsx

model:
  fields:
    - name: id
      type: integer
      description: Employee ID
    - name: name
      type: string
      description: Employee full name
    - name: email
      type: string
      description: Employee email address
    - name: department
      type: string
      description: Department name
    - name: salary
      type: decimal
      description: Annual salary
    - name: hire_date
      type: date
      description: Date employee was hired
    - name: status
      type: string
      description: Employment status (active/inactive)

schema_policy:
  unknown_fields: quarantine
  missing_fields: fail

quality:
  row_rules:
    - name: Valid Email
      sql: "email LIKE '%@%'"
      category: correctness
    - name: Valid Salary
      sql: "salary > 0"
      category: correctness
    - name: Active Employees Only
      sql: "status = 'active'"
      category: business_rule
  
  dataset_rules:
    - unique: id

transformations:
  - trim:
      fields: [name, email, department, status]
  - lower:
      fields: [email]

quarantine:
  include_error_reason: true
  include_categories: true
