version: 1.0.0
dataset: delta_customers
description: "Delta ingestion example"

source:
  type: file
  path: ./data/delta_table/
  format: delta

model:
  fields:
    - name: id
      type: integer
    - name: email
      type: string

quality:
  row_rules:
    - name: email_not_null
      rule: not_null
      column: email
      severity: warning
