version: 1.0.0
dataset: delta_customers
description: Delta ingestion example
source:
  type: file
  path: ./data/delta_table/
  format: delta
server:
  format: delta
model:
  fields:
  - name: id
    type: integer
  - name: email
    type: string
quality:
  row_rules:
  - not_null:
      field: email
      name: email_not_null
      severity: warning
