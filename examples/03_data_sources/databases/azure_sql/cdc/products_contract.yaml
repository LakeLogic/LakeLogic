version: 1.0.0
dataset: bronze_products
description: Bronze layer products from Azure SQL (CDC)
source:
  type: database
  connector: azuresql
  server: myserver.database.windows.net
  database: production_db
  table: dbo.products
  cdc:
    enabled: true
    watermark_column: updated_at
    watermark_type: timestamp
model:
  fields:
  - name: product_id
    type: integer
  - name: name
    type: string
  - name: category
    type: string
  - name: price
    type: decimal
  - name: updated_at
    type: timestamp
quality:
  row_rules:
  - not_null:
      field: product_id
      name: product_id_not_null
      severity: error
  - name: price_non_negative
    sql: price >= 0
    category: correctness
    severity: warning
materialization:
  good:
    enabled: true
    path: s3://datalake/bronze/products/
    format: delta
    mode: append
  quarantine:
    enabled: true
    path: s3://datalake/quarantine/products/
    format: delta
    mode: append
